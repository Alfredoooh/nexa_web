<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Looply — Criar publicação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --danger:#E5484D;--success:#2AC569;
  --font-main:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --emphasized:cubic-bezier(.2,0,0,1);--ios:cubic-bezier(.32,.72,0,1);
  --appbar-h:56px;
}
:root[data-theme="dark"]{
  --bg:#0D0D0D;--bg-elevated:#1A1A1A;--card:#1E1E1E;--card-elevated:#272727;
  --text:#FFFFFF;--text-dim:#A8A8A8;--border:#292929;
  --sheet-overlay:rgba(0,0,0,.6);--primary:#FFFFFF;--on-primary:#0D0D0D;
  --input-bg:#1E1E1E;--statusbar-dim:rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#FFFFFF;--bg-elevated:#F7F7F8;--card:#F1F1F3;--card-elevated:#E8E8EB;
  --text:#0A0A0A;--text-dim:#737373;--border:#ECECEC;
  --sheet-overlay:rgba(0,0,0,.35);--primary:#000000;--on-primary:#FFFFFF;
  --input-bg:#F2F2F2;--statusbar-dim:rgba(0,0,0,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);height:100%;overflow:hidden;}
html[data-enter="push"] body{animation:pageEnterPush .36s var(--ios) both;}
html[data-enter="pop"] body{animation:pageEnterPop .36s var(--ios) both;}
body.leaving-push{animation:pageLeavePush .22s var(--ios) forwards;}
body.leaving-pop{animation:pageLeavePop .22s var(--ios) forwards;}
@keyframes pageEnterPush{from{transform:translate3d(100%,0,0)}to{transform:translate3d(0,0,0)}}
@keyframes pageLeavePush{from{transform:translate3d(0,0,0)}to{transform:translate3d(-30%,0,0);opacity:.55}}
@keyframes pageEnterPop{from{transform:translate3d(-30%,0,0);opacity:.55}to{transform:translate3d(0,0,0);opacity:1}}
@keyframes pageLeavePop{from{transform:translate3d(0,0,0)}to{transform:translate3d(100%,0,0)}}

body{margin:0;padding:0;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);color:var(--text);font-family:var(--font-main);-webkit-user-select:none;user-select:none;position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);height:100%;transition:background .2s ease,color .2s ease;}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}

#statusbar-dim-overlay{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--statusbar-dim);z-index:500;opacity:0;pointer-events:none;transition:opacity .22s ease;}
#statusbar-dim-overlay.on{opacity:1;}

.page-bar{display:flex;align-items:center;gap:2px;height:var(--appbar-h);padding:0 6px;flex-shrink:0;background:var(--bg);}
.icon-tap{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s ease,transform .15s ease;}
.icon-tap:active{background:var(--bg-elevated);transform:scale(.92);}
.icon-tap .ic{width:23px;height:23px;}
.page-title{font-size:17px;font-weight:800;flex:1;}

.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--safe-bottom) + 30px);}

.cover-box{width:100%;aspect-ratio:16/10;border-radius:20px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:20px;position:relative;border:1.5px dashed var(--border);cursor:pointer;}
.cover-box img{width:100%;height:100%;object-fit:cover;}
.cover-box .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);}
.cover-box .ph .ic{width:32px;height:32px;}
.cover-box .ph span{font-size:13px;font-weight:600;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
.field input,.field textarea{width:100%;background:var(--input-bg);border:none;border-radius:12px;padding:13px 14px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none;}
.field textarea{resize:none;min-height:130px;line-height:1.5;}
.char-count{text-align:right;font-size:11.5px;color:var(--text-dim);margin-top:6px;}

.type-row{display:flex;gap:8px;flex-wrap:wrap;}
.type-chip{padding:9px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;}
.type-chip.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}

.submit-btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:8px;}
.submit-btn:active{opacity:.85;}
.submit-btn .ic{background-color:var(--on-primary);}
.hidden-file-input{display:none;}

.toast{position:fixed;bottom:calc(var(--safe-bottom) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--on-primary);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .ic{width:16px;height:16px;background-color:var(--on-primary);}
</style>
</head>
<body>

<div id="statusbar-dim-overlay"></div>

<div class="page-bar">
  <button class="icon-tap" onclick="goBack('index.html')">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/chevron-left.svg);mask-image:url(assets/icons/svg/chevron-left.svg)"></span>
  </button>
  <div class="page-title">Criar publicação</div>
</div>

<div class="page-body">
  <div class="cover-box" id="coverBox" onclick="document.getElementById('coverFileInput').click()">
    <img id="coverImg" src="" alt="" style="display:none">
    <div class="ph" id="coverPh">
      <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/image.svg);mask-image:url(assets/icons/svg/image.svg)"></span>
      <span>Toca para escolher a capa</span>
    </div>
  </div>
  <input type="file" id="coverFileInput" class="hidden-file-input" accept="image/*,image/gif">

  <div class="field">
    <label>Categoria</label>
    <div class="type-row" id="typeRow">
      <button class="type-chip active" data-t="gifs">GIF</button>
      <button class="type-chip" data-t="stickers">Sticker</button>
      <button class="type-chip" data-t="memes">Meme</button>
      <button class="type-chip" data-t="clips">Clip</button>
    </div>
  </div>

  <div class="field">
    <label>Título</label>
    <input id="titleInput" type="text" placeholder="Dá um título à tua publicação" maxlength="100">
  </div>

  <div class="field">
    <label>Descrição</label>
    <textarea id="descInput" placeholder="Escreve algo sobre esta publicação..." maxlength="600"></textarea>
    <div class="char-count"><span id="descCount">0</span>/600</div>
  </div>

  <button class="submit-btn" onclick="submitPost()">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/check-circle.svg);mask-image:url(assets/icons/svg/check-circle.svg)"></span>
    Publicar
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
function loadJSON(key, fb){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function getContent(){ return loadJSON('looply_content', {gifs:[],stickers:[],memes:[],clips:[]}); }
function setContent(c){ saveJSON('looply_content', c); }

(function(){
  var nav=sessionStorage.getItem('looply_nav'); sessionStorage.removeItem('looply_nav');
  if(nav==='push') document.documentElement.setAttribute('data-enter','push');
  else if(nav==='pop') document.documentElement.setAttribute('data-enter','pop');
})();
function goTo(url){ sessionStorage.setItem('looply_nav','push'); document.body.classList.add('leaving-push'); setTimeout(function(){ location.href=url; }, 210); }
function goBack(fallback){
  sessionStorage.setItem('looply_nav','pop');
  document.body.classList.add('leaving-pop');
  setTimeout(function(){ if(history.length>1) history.back(); else location.href=fallback||'index.html'; }, 210);
}

var toastTimer=null;
function showToast(msg, iconFile){
  var el=document.getElementById('toast');
  el.innerHTML='<span class="ic" style="-webkit-mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg);mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg)"></span> '+msg;
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme==='dark'?'#0D0D0D':'#FFFFFF');
  if(typeof Android!=='undefined'){
    if(typeof Android.setStatusBarColor==='function') Android.setStatusBarColor(theme==='dark'?'#0D0D0D':'#FFFFFF');
    if(typeof Android.setStatusBarLight==='function') Android.setStatusBarLight(theme==='light');
  }
}

var postType='gifs', coverData='';
document.querySelectorAll('#typeRow .type-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    postType=chip.dataset.t;
    document.querySelectorAll('#typeRow .type-chip').forEach(function(c){ c.classList.remove('active'); });
    chip.classList.add('active');
  });
});
document.getElementById('coverFileInput').addEventListener('change', function(e){
  var f=e.target.files && e.target.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    coverData=ev.target.result;
    document.getElementById('coverImg').src=coverData;
    document.getElementById('coverImg').style.display='block';
    document.getElementById('coverPh').style.display='none';
  };
  reader.readAsDataURL(f);
});
document.getElementById('descInput').addEventListener('input', function(){
  document.getElementById('descCount').textContent=this.value.length;
});

function submitPost(){
  var title=document.getElementById('titleInput').value.trim();
  var desc=document.getElementById('descInput').value.trim();
  if(!coverData){ showToast('Escolhe uma imagem de capa','alert'); return; }
  if(!title){ showToast('Dá um título à publicação','alert'); return; }

  var content=getContent();
  if(!content[postType]) content[postType]=[];
  content[postType].push({
    id:'post_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    src:coverData, title:title, description:desc, caption:desc,
    tags:[], likes:0, kind:'post', createdAt:Date.now()
  });
  setContent(content);
  localStorage.setItem('looply_active_tab','library');
  showToast('Publicado com sucesso','check-circle');
  setTimeout(function(){ goTo('index.html'); }, 650);
}

(function init(){
  setTheme(localStorage.getItem('looply_theme')||'dark');
})();
</script>

</body>
</html>
