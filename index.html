<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F12">
<title>app ao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:'profile search home home_filled library library_filled albums menu settings chevron-right language chat back link share lock edit close check check-circle theme trash mail phone clock warning moon sun send'.split(' ').map(function(n){return '.i-'+n+'{--i:url(assets/icons/svg/'+n+'.svg)}'}).join('')}));
</script>
<style>
:root{--danger:#E5484D;--font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ios:cubic-bezier(.32,.72,0,1);--smooth:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1)}
:root[data-theme=dark]{--bg:#0D0F12;--card:#1A1E23;--card2:#22272D;--text:#fff;--dim:#B0B5BC;--line:#242830;--scrim:rgba(0,0,0,.6);--pri:#fff;--onpri:#0D0F12;--pop:#22272D;--shadow:0 18px 44px rgba(0,0,0,.6)}
:root[data-theme=light]{--bg:#fff;--card:#F2F2F2;--card2:#EBEBEB;--text:#000;--dim:#666;--line:#E5E5E5;--scrim:rgba(0,0,0,.34);--pri:#000;--onpri:#fff;--pop:#fff;--shadow:0 18px 44px rgba(0,0,0,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{position:fixed;inset:0;color:var(--text);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
input::-webkit-search-cancel-button{display:none}
h1{margin:0}
.ic{display:inline-block;flex:none;width:22px;height:22px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}

#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .5s var(--ios);will-change:transform}
#app.push{transform:translate3d(-22%,0,0)}
#dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .5s var(--ios)}
header{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:calc(56px + var(--st));padding:var(--st) 8px 0;flex:none}
.logo{height:28px;width:auto;display:block;margin:0 auto}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring),background .2s}
.hbtn:active{transform:scale(.88);background:var(--card)}
.hbtn .ic{width:23px;height:23px}
.avatar{position:relative;display:grid;place-items:center;width:34px;height:34px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--card);flex:none}
.avatar .ic{width:55%;height:55%;color:var(--dim)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.pills{display:flex;gap:8px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;flex:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:9px 16px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap;transition:background .3s,color .3s,border-color .3s,transform .3s var(--spring)}
.pill.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.pill:active{transform:scale(.94)}
#tabs{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column}
.pane.on{display:flex;animation:pin .35s var(--smooth)}
@keyframes pin{from{opacity:0;transform:translate3d(0,10px,0)}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.h1{font-size:28px;font-weight:800;letter-spacing:-.6px;padding:6px 20px 12px}
.sub{padding:0 20px 12px;margin-top:-8px;font-size:13px;color:var(--dim)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);padding:20px 20px 8px}
.lb{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin:0 4px 8px}
.hint{margin:0;padding:4px 0 12px;font-size:13.5px;line-height:1.55;color:var(--dim)}
.gap{height:14px}

.feed{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:6px 14px 28px;align-items:start}
.nc{display:block;width:100%;min-width:0;text-align:left;transition:transform .35s var(--smooth)}
.nc:active{transform:scale(.97)}
.th{position:relative;display:block;overflow:hidden;border-radius:18px;background:var(--card)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.th img.ok{opacity:1}
.th img.lg{object-fit:contain;padding:26%}
.th.ph{background:linear-gradient(135deg,var(--card),var(--card2))}
.th.ph::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--dim);opacity:.7}
.tag{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;font-weight:700;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.meta{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:var(--dim)}
.meta b{color:var(--text);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{white-space:nowrap;flex:none}
.rg{padding:2px 7px;border-radius:6px;background:var(--card);color:var(--dim);font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.tt{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;line-height:1.28;letter-spacing:-.15px}
.hero{grid-column:1/-1}
.hero .th{aspect-ratio:16/10;border-radius:22px}
.hero .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.04) 65%)}
.hero .tt{font-size:21px;-webkit-line-clamp:3;color:#fff}
.hero .meta{margin-bottom:7px;color:rgba(255,255,255,.78)}
.hero .meta b{color:#fff}
.half .th{aspect-ratio:4/5}
.half+.half .th{aspect-ratio:1}
.half .meta{margin:10px 2px 5px}
.half .tt{margin:0 2px;font-size:14.5px;-webkit-line-clamp:3}
.row{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}
.row .th{width:104px;aspect-ratio:4/3;border-radius:14px;flex:none}
.row .bd{display:block;flex:1;min-width:0}
.row .meta{margin-bottom:6px}
.row .tt{font-size:15px;-webkit-line-clamp:3}
.row.no .th{display:none}
.lr{grid-column:1/-1;display:flex;align-items:flex-start;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.lr .row{flex:1;padding:0;border:0}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:none;color:var(--dim);transition:background .2s,transform .3s var(--spring)}
.x:active{background:var(--card);transform:scale(.88)}
.x .ic{width:17px;height:17px}
.snt{grid-column:1/-1;height:1px}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
.sk.l{height:14px;margin:0 0 12px;border-radius:8px}
.sk.s{width:60%}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{grid-column:1/-1;padding:64px 28px;text-align:center;color:var(--dim)}
.empty .ic{width:42px;height:42px;margin-bottom:10px;color:var(--text);opacity:.55}
.empty b{display:block;margin-bottom:4px;font-size:16px;color:var(--text)}
.empty p{margin:0;font-size:13px;line-height:1.5}

#bar{flex:none;z-index:30;display:flex;height:calc(58px + var(--sb));padding-bottom:var(--sb);background:var(--bg);border-top:1px solid var(--line)}
.bb{position:relative;flex:1;display:grid;place-items:center;color:var(--dim);transition:color .25s,transform .3s var(--spring)}
.bb .ic{width:25px;height:25px}
.bb:active{transform:scale(.86)}
.bb.on{color:var(--text)}
.bb::after{content:'';position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text);transform:scale(0);transition:transform .35s var(--spring)}
.bb.on::after{transform:scale(1)}

.fld{display:flex;align-items:center;justify-content:flex-start;gap:12px;height:54px;padding:0 16px;border-radius:18px;background:var(--card);border:1.5px solid transparent;text-align:left;transition:border-color .3s var(--smooth),background .3s}
.fld:focus-within{border-color:var(--text);background:var(--bg)}
.fld .ic{width:19px;height:19px;color:var(--dim);transition:color .3s}
.fld:focus-within .ic{color:var(--text)}
.fld input,.fld select{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;text-align:left;font-size:15px;font-weight:500}
.fld input::placeholder{color:var(--dim);opacity:1;text-align:left}
.fld select{flex:none;width:auto;max-width:98px;padding:0;font-weight:700;-webkit-appearance:none;appearance:none}
.fld option{color:#000}
.fld .dv{width:1px;height:22px;background:var(--line);flex:none}
.fld[hidden],.qx[hidden]{display:none}
.sf{height:50px;margin:0 16px 4px;border-radius:99px}
.qx{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;flex:none}
.qx .ic{width:16px;height:16px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:18px;background:var(--pri);color:var(--onpri);font-size:15px;font-weight:800;transition:transform .3s var(--spring),opacity .2s}
.cta:active{transform:scale(.97);opacity:.9}
.cta:disabled{opacity:.5;pointer-events:none}
.cta.o{background:none;border:1.5px solid var(--line);color:var(--text)}
.cta.sm{height:46px;border-radius:16px;font-size:14px}
.cta .ic{width:18px;height:18px}

.rw{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;text-align:left;transition:background .2s}
.rw:active{background:var(--card)}
.rw>.ic:first-child{color:var(--dim)}
.rw .tx{flex:1;min-width:0}
.rw .t{display:block;font-size:14.5px;font-weight:700}
.rw .s{display:block;margin-top:2px;font-size:12px;color:var(--dim)}
.rw .v{font-size:13px;font-weight:600;color:var(--dim)}
.rw.dg,.rw.dg>.ic:first-child{color:var(--danger)}
.ic.ch{width:16px;height:16px;color:var(--dim);opacity:.6}
.pc{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:2px 16px 6px;padding:16px;border-radius:22px;background:var(--card);text-align:left;transition:transform .3s var(--spring)}
.pc:active{transform:scale(.98)}
.pc .avatar{width:54px;height:54px}
.pc .tx{flex:1;min-width:0}
.pc .t{display:block;font-size:16px;font-weight:800}
.pc .s{display:block;margin-top:2px;font-size:12.5px;color:var(--dim)}
.foot{margin:16px 4px 0;font-size:11.5px;line-height:1.5;text-align:center;color:var(--dim)}
.foot b{color:var(--text)}

.lh{display:flex;align-items:center;justify-content:space-between;padding-right:20px}
.lk{font-size:12.5px;font-weight:700}
.rc{display:flex;align-items:center;gap:14px;padding:6px 14px 6px 20px;cursor:pointer}
.rc>.ic{width:19px;height:19px;color:var(--dim)}
.rc span{flex:1;font-size:14.5px;font-weight:500}
.rk{display:flex;align-items:center;gap:16px;width:100%;padding:12px 20px;text-align:left}
.rk em{width:24px;font-size:20px;font-style:normal;font-weight:800;letter-spacing:-.5px;color:var(--dim)}
.rk span{flex:1;font-size:15px;font-weight:700}

.page{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(100%,0,0);visibility:hidden;transition:transform .5s var(--ios),visibility 0s .5s;will-change:transform}
.page.on{transform:none;visibility:visible;transition:transform .5s var(--ios),visibility 0s}
.page.drag{transition:none!important}
.pbar{flex:none;display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 6px) 8px 6px}
.ptitle{flex:1;min-width:0;padding-left:4px;font-size:18px;font-weight:800}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
#edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:70;display:none;touch-action:none}
#edge.on{display:block}

.ah{margin:6px 16px 0;aspect-ratio:16/10;border-radius:24px}
.am{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 20px 8px;font-size:12px;font-weight:600;color:var(--dim)}
.am b{font-weight:800;color:var(--text)}
.at{padding:0 20px;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
.as{margin:14px 20px 0;padding:14px 16px;border-radius:18px;background:var(--card);font-size:14.5px;line-height:1.6;color:var(--dim)}
.aa{display:flex;gap:10px;padding:16px 20px 2px}
.aa .cta{flex:1}
.ac{padding:18px 20px 4px}
.ac p{margin:0 0 16px;font-size:16px;line-height:1.72}
.ac p.hint{font-size:13.5px;line-height:1.55}
.cmh{display:flex;align-items:center;gap:8px;margin-top:12px;padding:20px 20px 8px;border-top:1px solid var(--line);font-size:16px;font-weight:800}
.cmh .ic{width:20px;height:20px}
#cL .hint{padding:4px 20px 12px}
.cmi{display:flex;gap:12px;padding:10px 20px;animation:pin .45s var(--smooth)}
.cmi .avatar{width:36px;height:36px}
.cmi .bd{flex:1;min-width:0}
.nm{font-size:13px;font-weight:800}
.nm span{margin-left:6px;font-size:11.5px;font-weight:600;color:var(--dim)}
.cmi .ct{margin-top:3px;font-size:14.5px;line-height:1.5;word-break:break-word}
.cbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + var(--sb));border-top:1px solid var(--line);background:var(--bg)}
.cbar .avatar{width:36px;height:36px}
.cbar .fld{flex:1;height:46px;border-radius:99px}
.send{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--onpri);transition:transform .3s var(--spring),opacity .25s}
.send:active{transform:scale(.88)}
.send:disabled{opacity:.35;pointer-events:none}
.send .ic{width:20px;height:20px}
.avbig{position:relative;display:block;margin:10px auto 20px}
.avbig .avatar{width:96px;height:96px}
.cam{position:absolute;right:0;bottom:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);background:var(--pri);color:var(--onpri)}
.cam .ic{width:14px;height:14px}
.form{padding:0 20px}

#auth{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(0,100%,0);visibility:hidden;transition:transform .55s var(--ios),visibility 0s .55s}
#auth.on{transform:none;visibility:visible;transition:transform .55s var(--ios),visibility 0s}
.abar{flex:none;height:calc(52px + var(--st));padding:var(--st) 8px 0}
.abody{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:0 20px calc(28px + var(--sb))}
.a0{padding:2px 0 20px;text-align:center}
.a0 .logo{height:44px}
.a0 p{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--dim)}
.seg{position:relative;display:flex;flex:none;height:48px;margin-bottom:20px;padding:4px;border-radius:18px;background:var(--card)}
.seg>i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:var(--pri);transition:transform .5s var(--ios)}
.seg.r>i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;flex:1;font-size:14px;font-weight:700;color:var(--dim);transition:color .3s}
.seg button.on{color:var(--onpri)}
.vp{flex:none;overflow:hidden}
.track{display:flex;width:200%;align-items:flex-start;transition:transform .5s var(--ios)}
.track.r{transform:translate3d(-50%,0,0)}
.ap{width:50%;padding:0 1px;transition:opacity .35s}
.track:not(.r) .ap:last-child,.track.r .ap:first-child{opacity:0;pointer-events:none}
.idt{display:flex;gap:8px;margin-bottom:10px}
.idt button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim);transition:all .3s var(--smooth)}
.idt button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.err{min-height:20px;padding:10px 4px 6px;font-size:12.5px;font-weight:600;text-align:center;color:var(--danger)}

#mscrim{position:fixed;inset:0;z-index:499;background:rgba(0,0,0,0);transition:background .3s}
#mscrim.in{background:rgba(0,0,0,.14)}
.menu{position:fixed;z-index:500;min-width:230px;padding:8px;border-radius:26px;background:var(--pop);box-shadow:var(--shadow);opacity:0;transform:scale(.5);transition:opacity .22s,transform .5s var(--spring)}
.menu.in{opacity:1;transform:none}
.menu.out{opacity:0;transform:scale(.9);transition:opacity .16s,transform .2s var(--smooth)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:18px;text-align:left;font-size:15px;font-weight:600;opacity:0;transform:translate3d(0,-8px,0);transition:opacity .3s var(--smooth),transform .45s var(--spring),background .15s}
.menu.in button{opacity:1;transform:none;transition-delay:var(--d),var(--d),0s}
.menu button:active{background:var(--card2)}
.menu .ic{color:var(--dim)}
.menu .ic.ml{width:18px;height:18px;margin-left:auto;color:var(--text)}

#sheet{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(var(--sb) + 10px);background:rgba(0,0,0,0);visibility:hidden;transition:background .4s,visibility 0s .55s}
#sheet.on{background:var(--scrim);visibility:visible;transition:background .4s,visibility 0s}
.sp{width:100%;max-width:480px;padding:12px 20px 20px;border-radius:32px;background:var(--bg);box-shadow:var(--shadow);transform:translate3d(0,calc(100% + 30px),0);transition:transform .55s var(--ios)}
#sheet.on .sp{transform:none}
.sp .hd{width:38px;height:4px;margin:0 auto 16px;border-radius:9px;background:var(--line)}
.sp h3{margin:0 0 6px;font-size:19px;font-weight:800}
.sp p{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--dim)}
.acts{display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(58px + var(--sb) + 18px);z-index:600;display:flex;align-items:center;gap:8px;padding:13px 20px;border-radius:99px;background:var(--pri);color:var(--onpri);font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translate3d(-50%,24px,0) scale(.9);transition:opacity .25s,transform .5s var(--spring)}
#toast.on{opacity:1;transform:translate3d(-50%,0,0) scale(1)}
#toast .ic{width:17px;height:17px}
#file{display:none}
</style>
</head>
<body>

<div id="app">
  <header>
    <button class="hbtn" id="hAv" aria-label="Perfil"><span class="avatar"><i class="ic i-profile"></i><img data-av src="assets/icons/png/avatar.png" alt=""></span></button>
    <img class="logo" src="assets/icons/png/logo.png" alt="app ao">
    <button class="hbtn" id="hMore" aria-label="Mais"><i class="ic i-menu"></i></button>
  </header>

  <div id="tabs">
    <section class="pane on" id="p-home">
      <div class="pills" id="pills"></div>
      <div class="scroll" id="hScroll"><div class="feed" id="feed"></div></div>
    </section>

    <section class="pane" id="p-search">
      <h1 class="h1">Pesquisar</h1>
      <label class="fld sf"><i class="ic i-search"></i><input id="q" type="search" placeholder="Angola, mundo, desporto…" enterkeyhint="search" autocomplete="off"><button class="qx" id="qx" hidden aria-label="Limpar"><i class="ic i-close"></i></button></label>
      <div class="scroll" id="sBody"></div>
    </section>

    <section class="pane" id="p-lib">
      <div class="scroll">
        <h1 class="h1">Biblioteca</h1>
        <div class="sub" id="libCount"></div>
        <div class="feed" id="libList"></div>
      </div>
    </section>

    <section class="pane" id="p-hub">

  .then(function(x){

    rput('auth_token',x.data.token);put('user',x.data.user);

/* ===== REDE: proxies CORS ===== */
var PX=[function(u){return'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},function(u){return'https://corsproxy.io/?'+encodeURIComponent(u)}];
function net(u,ms){
  return new Promise(function(ok,no){
    var i=0;
    (function t(){
      if(i>=PX.length)return no(new Error('net'));
      var c=new AbortController(),m=setTimeout(function(){c.abort()},ms||9000);
      fetch(PX[i++](u),{signal:c.signal}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(x){clearTimeout(m);if(x&&x.length>80)ok(x);else t()}).catch(function(){clearTimeout(m);t()})
    })()
  })
}
function collect(js,ms){
  var out=[];
  return new Promise(function(done){
    var n=js.length,f=0;
    function end(){if(!f){f=1;done(out)}}
    if(!n)return end();
    js.forEach(function(j){j.then(function(a){out.push.apply(out,a)}).catch(function(){}).then(function(){if(--n<1)end()})});
    setTimeout(end,ms)
  })
}

/* ===== NOTÍCIAS: parse ===== */
function pick(h){var m=/<img[^>]+src=["']([^"']+)["']/i.exec(h||'');return m?m[1].replace(/&amp;/g,'&'):''}
function paras(h){
  if(!h)return[];
  return $$('p',new DOMParser().parseFromString(h,'text/html')).map(function(p){return(p.textContent||'').replace(/\s+/g,' ').trim()}).filter(function(t){return t.length>50}).slice(0,20)
}
function norm(o,rg){
  var t=txt(o.title),l=String(o.link||'').trim();if(!t||!l)return null;
  var s=o.source,sn=txt(s&&typeof s==='object'?(s._||s.name||''):s)||'Notícias',su=o.sourceUrl||(s&&s.url)||'',x=' - '+sn,h='';
  if(t.slice(-x.length)===x)t=t.slice(0,-x.length);
  var sm=txt(o.summary);if(sm.indexOf(t)===0&&sm.length<t.length+90)sm='';
  try{h=new URL(su).hostname}catch(e){}
  var im=https(o.image);
  return{id:hid(l),title:t,summary:sm.slice(0,600),link:l,source:sn,date:o.date||'',image:/pixel|1x1|feedburner|blank\.gif|spacer/i.test(im)?'':im,logo:h?'https://www.google.com/s2/favicons?domain='+h+'&sz=128':'',region:rg,body:o.body||[]}
}
function parse(xml,rg,name){
  return $$('item,entry',new DOMParser().parseFromString(xml,'text/xml')).map(function(n){
    var g=function(t){var e=n.getElementsByTagName(t)[0];return e?e.textContent:''},
        a=function(t,k){var e=n.getElementsByTagName(t)[0];return e?e.getAttribute(k)||'':''},
        h=g('content:encoded')||g('description')||g('summary')||g('content'),
        en=/image/.test(a('enclosure','type'))?a('enclosure','url'):'',
        se=n.getElementsByTagName('source')[0];
    return norm({title:g('title'),link:g('link')||a('link','href'),summary:g('description')||g('summary'),source:se?se.textContent:(name||g('dc:creator')),sourceUrl:se?se.getAttribute('url'):'',date:g('pubDate')||g('published')||g('updated')||g('dc:date'),image:a('media:content','url')||a('media:thumbnail','url')||en||a('itunes:image','href')||pick(h),body:paras(g('content:encoded'))},rg)
  }).filter(Boolean)
}
function rss(u,rg,name){return net(u).then(function(x){return parse(x,rg,name)})}
function worker(q){
  return fetch(API+'/news?q='+encodeURIComponent(q)+'&country=AO&lang=pt&page=1',{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    return((d&&(d.items||d.data||d.results))||[]).map(function(i){return norm({title:i.title||i.name,link:i.link||i.url,summary:i.description||i.content,source:i.source||i.author,date:i.pubDate||i.published||i.date,image:i.thumbnail||i.image||(i.enclosure&&i.enclosure.link)},'ao')}).filter(Boolean)
  })
}
function GN(q,ao){return'https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:7d')+(ao?'&hl=pt-PT&gl=AO&ceid=AO:pt-419':'&hl=pt-PT&gl=PT&ceid=PT:pt-150')}
function GT(t){return'https://news.google.com/rss/headlines/section/topic/'+t+'?hl=pt-PT&gl=PT&ceid=PT:pt-150'}
function jobs(c){
  var j=[];
  if(c.ao){j.push(worker(c.ao),rss(GN(c.ao,1),'ao'))}
  if(c.w)j.push(rss(GT(c.w),'world'));
  (c.fa?FA:[]).concat(c.fw?FW:[],c.x||[]).forEach(function(f){j.push(rss(f[0],f[2],f[1]))});
  return j
}
function dedupe(all){
  var seen={};
  return all.filter(function(i){var k=i.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60)||i.title;return seen[k]?0:(seen[k]=1)}).sort(function(a,b){return(new Date(b.date).getTime()||0)-(new Date(a.date).getTime()||0)})
}
function mix(all){
  var u=dedupe(all),a=u.filter(function(i){return i.region==='ao'}),w=u.filter(function(i){return i.region!=='ao'}),o=[];
  while(a.length||w.length){if(a.length)o.push(a.shift());if(w.length)o.push(w.shift())}
  return o
}

/* ===== FEED (tamanhos variados) ===== */
function card(it,k){
  DB[it.id]=it;
  var pic=it.image||it.logo,
      th='<span class="th'+(pic?'':' ph')+'" data-l="'+esc((it.source||'?').charAt(0).toUpperCase())+'">'+(pic?'<img'+(it.image?'':' class="lg"')+' src="'+esc(pic)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':''),
      rg=it.region==='ao'?'Angola':'Internacional',
      mt='<span class="meta"><b>'+esc(it.source)+'</b><span>'+esc(ago(it.date))+'</span>'+(k==='row'?'<span class="rg">'+rg+'</span>':'')+'</span>',
      tl='<span class="tt">'+esc(it.title)+'</span>',
      o='<button class="nc '+k+(k==='row'&&!pic?' no':'')+'" data-id="'+it.id+'">';
  if(k==='hero')return o+th+'<span class="tag">'+rg+'</span><span class="ov">'+mt+tl+'</span></span></button>';
  if(k==='half')return o+th+'<span class="tag">'+rg+'</span></span>'+mt+tl+'</button>';
  return o+th+'</span><span class="bd">'+mt+tl+'</span></button>'
}
function plan(a,n){
  var im=a.filter(function(i){return i.image}),no=a.filter(function(i){return!i.image}),out=[];
  while(im.length||no.length){
    var p=n%6,k=p?(p<3?'half':'row'):'hero',it;
    if(k!=='row'){it=im.shift();if(!it){k='row';it=no.shift()}}else it=no.shift()||im.shift();
    out.push({it:it,k:k});n++
  }
  return out
}
function skel(r){
  return(r?'':'<div class="sk" style="grid-column:1/-1;aspect-ratio:16/10;border-radius:22px"></div><div class="sk" style="aspect-ratio:4/5"></div><div class="sk" style="aspect-ratio:1"></div>')+new Array((r?6:3)+1).join('<div class="sk" style="grid-column:1/-1;height:78px"></div>')
}
var TABS=['home','search','lib','hub'],cat='all',reqId=0,sReq=0,loaded=0,cache={},DB={},list=[],pos=0,art=null,sf='all',sres=[];
var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();more()}},{root:$('#hScroll'),rootMargin:'700px'});
function show(items){list=items;pos=0;var b=$('#feed');b.innerHTML='';b.dataset.n=0;more()}
function more(){
  var b=$('#feed'),chunk=list.slice(pos,pos+12);if(!chunk.length)return;
  pos+=chunk.length;
  var n=+b.dataset.n||0,html=plan(chunk,n).map(function(o){return card(o.it,o.k)}).join(''),old=$('.snt',b);
  b.dataset.n=n+chunk.length;if(old)old.remove();
  b.insertAdjacentHTML('beforeend',html);
  if(pos<list.length){var s=document.createElement('div');s.className='snt';b.appendChild(s);io.observe(s)}
}
function load(force){
  loaded=1;
  var c=CATS.filter(function(x){return x.id===cat})[0],my=++reqId,b=$('#feed'),ch=cache[cat];
  if(ch&&!force&&Date.now()-ch.t<3e5){show(ch.items);return}
  b.dataset.n=0;b.innerHTML=skel();
  collect(jobs(c),8000).then(function(all){
    if(my!==reqId)return;
    var items=mix(all);
    if(!items.length){b.innerHTML=empty('warning','Não foi possível carregar as notícias','Verifica a ligação à internet e tenta novamente.');return}
    cache[cat]={t:Date.now(),items:items};show(items)
  })
}

function search(q){

  put('search_history',[q].concat(hist().filter(function(x){return x.toLowerCase()!==q.toLowerCase()})).slice(0,30));

  var my=++sReq;

}

function content(it){
  var c=$('#aC');
  if(it.body&&it.body.length>1){c.innerHTML=it.body.map(function(p){return'<p>'+esc(p)+'</p>'}).join('');return}
  if(!it.link||/news\.google\.com/.test(it.link)){c.innerHTML='<p class="hint">Este é um resumo da notícia. Toca em “Ler original” para veres o artigo completo.</p>';return}
  c.innerHTML='<div class="sk l"></div><div class="sk l"></div><div class="sk l s"></div>';
  net(it.link,10000).then(function(h){
    if(art!==it)return;
    var d=new DOMParser().parseFromString(h,'text/html'),og=$('meta[property="og:image"]',d),ps=[];
    ['article p','main p','p'].some(function(s){var seen={};ps=$$(s,d).map(function(p){return(p.textContent||'').replace(/\s+/g,' ').trim()}).filter(function(t){return t.length>60&&!seen[t]&&(seen[t]=1)});return ps.length>1});
    if(og&&og.content&&!it.image){try{it.image=https(new URL(og.content,it.link).href);var th=$('.ah');th.classList.remove('ph');th.insertAdjacentHTML('afterbegin','<img src="'+esc(it.image)+'" alt="" referrerpolicy="no-referrer">')}catch(e){}}
    if(ps.length>1){it.body=ps.slice(0,25);c.innerHTML=it.body.map(function(p){return'<p>'+esc(p)+'</p>'}).join('')}
    else c.innerHTML='<p class="hint">Não foi possível carregar o texto completo. Toca em “Ler original” para abrir a notícia.</p>'
  }).catch(function(){if(art===it)c.innerHTML='<p class="hint">Não foi possível carregar o texto completo. Toca em “Ler original” para abrir a notícia.</p>'})
