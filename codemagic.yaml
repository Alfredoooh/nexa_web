workflows:
  android-build:
    name: MyApp Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - myapp_keystore
      groups:
        - myapp_env
      vars:
        PACKAGE_NAME: "com.exemplo.myapp"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Gradle and generate wrapper
        script: |
          if [ ! -f "./gradlew" ]; then
            sdk install gradle 8.7 || true
            gradle wrapper --gradle-version 8.7
          fi
      - name: Set executable permissions for gradlew
        script: |
          chmod +x ./gradlew
      - name: Build Android release APK
        script: |
          ./gradlew assembleRelease
      - name: Build Android release App Bundle
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com
        notify:
          success: true
          failure: true