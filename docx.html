<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Looply</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.1.0/css/ionicons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --danger: #E5484D;
    --success: #2AC569;
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-logo: 'Grand Hotel', cursive;
  }

  :root[data-theme="dark"] {
    --bg: #000000;
    --bg-elevated: #121212;
    --card: #1A1A1A;
    --text: #FFFFFF;
    --text-dim: #A8A8A8;
    --border: #262626;
    --drawer-overlay: rgba(0,0,0,0.6);
    --primary: #FFFFFF;
    --on-primary: #000000;
    --input-bg: #1A1A1A;
    --skeleton: #1E1E1E;
  }

  :root[data-theme="light"] {
    --bg: #FFFFFF;
    --bg-elevated: #FAFAFA;
    --card: #FFFFFF;
    --text: #0A0A0A;
    --text-dim: #737373;
    --border: #EBEBEB;
    --drawer-overlay: rgba(0,0,0,0.35);
    --primary: #000000;
    --on-primary: #FFFFFF;
    --input-bg: #F2F2F2;
    --skeleton: #EDEDED;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { background: var(--bg); height: 100%; overflow: hidden; }

  body {
    margin: 0;
    padding: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color: var(--text);
    font-family: var(--font-main);
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.2s ease, color 0.2s ease;
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    flex-shrink: 0;
    background: var(--bg);
    z-index: 20;
    gap: 10px;
  }

  header .left {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-tap {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .icon-tap:active { background: var(--bg-elevated); transform: scale(0.92); }

  .logo {
    font-family: var(--font-logo);
    font-size: 34px;
    font-weight: 400;
    margin: 0;
    color: var(--text);
    letter-spacing: 0.5px;
    line-height: 1;
    padding-left: 4px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* Category pills */
  .category-row {
    display: flex;
    gap: 8px;
    padding: 2px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  .category-row::-webkit-scrollbar { display: none; }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }

  .pill ion-icon { font-size: 15px; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  .container { padding: 0 12px 90px; }

  .search-row {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
  }

  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--input-bg);
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
  }

  .input-wrap ion-icon { color: var(--text-dim); font-size: 18px; flex-shrink: 0; }

  .input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }

  .input-wrap input::placeholder { color: var(--text-dim); opacity: 0.8; }

  .search-btn {
    width: 46px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: var(--on-primary);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-btn:active { opacity: 0.75; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .result-item {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--skeleton);
    cursor: pointer;
    min-height: 140px;
  }

  .result-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .result-meta {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-meta span {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .sentinel {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .sentinel ion-icon { font-size: 18px; animation: spin 0.9s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state ion-icon { font-size: 44px; margin-bottom: 10px; display: block; opacity: 0.5; }
  .empty-state p { margin: 0; font-size: 14px; line-height: 1.4; }
  .empty-state .es-title { color: var(--text); font-weight: 700; font-size: 16px; margin-bottom: 4px; }

  /* Skeleton loading */
  .skeleton-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
  .skeleton-item {
    border-radius: 14px;
    aspect-ratio: 1;
    background: linear-gradient(90deg, var(--skeleton) 25%, var(--bg-elevated) 50%, var(--skeleton) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Drawer — RIGHT SIDE */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: var(--drawer-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 60;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    width: 80%;
    max-width: 310px;
    background: var(--bg);
    z-index: 61;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0,0,0,0.25);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .drawer-header .logo { font-size: 26px; }

  .drawer-section { padding: 18px 20px 6px; }
  .drawer-section .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .theme-toggle {
    display: flex;
    background: var(--input-bg);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }

  .theme-toggle button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .theme-toggle button.active {
    background: var(--primary);
    color: var(--on-primary);
  }

  .drawer-field { padding: 8px 20px 20px; }

  .drawer-save {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: var(--on-primary);
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .drawer-save:active { opacity: 0.8; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
    min-height: 16px;
  }
  .status-line.ok { color: var(--success); }
  .status-line.error { color: var(--danger); }
  .status-line ion-icon { font-size: 15px; }

  .drawer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    color: var(--text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    border-top: 1px solid var(--border);
  }
  .drawer-item ion-icon { font-size: 20px; color: var(--text-dim); }
  .drawer-item:active { background: var(--bg-elevated); }

  /* Content viewer modal (click item) */
  .viewer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 70;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .viewer-overlay.open { opacity: 1; pointer-events: auto; }

  .viewer-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px;
    flex-shrink: 0;
  }

  .viewer-top .icon-tap { color: #fff; background: rgba(255,255,255,0.12); }
  .viewer-top .icon-tap:active { background: rgba(255,255,255,0.22); }

  .viewer-media {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    min-height: 0;
  }

  .viewer-media img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 16px;
  }

  .viewer-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .vaction {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    width: 62px;
  }

  .vaction .vicon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .vaction:active .vicon { transform: scale(0.9); background: rgba(255,255,255,0.22); }

  /* Share sheet */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    display: flex;
    align-items: flex-end;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .share-sheet {
    width: 100%;
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .sheet-overlay.open .share-sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 100px;
    background: var(--border);
    margin: 0 auto 14px;
  }

  .sheet-title {
    font-size: 15px;
    font-weight: 700;
    padding: 0 20px 14px;
  }

  .share-apps-row {
    display: flex;
    gap: 18px;
    padding: 0 20px 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .share-apps-row::-webkit-scrollbar { display: none; }

  .share-app-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    width: 60px;
  }

  .share-app-btn .app-icon {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
  }
  .share-app-btn:active .app-icon { transform: scale(0.92); }

  .sheet-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .sheet-row:active { background: var(--bg-elevated); }
  .sheet-row ion-icon { font-size: 20px; color: var(--text-dim); }
  .sheet-row.danger { color: var(--danger); }
  .sheet-row.danger ion-icon { color: var(--danger); }

  /* Editor modal (create/edit) */
  .editor-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 90;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .editor-overlay.open { transform: translateX(0); }

  .editor-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .editor-top h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    flex: 1;
  }

  .editor-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 30px);
    -webkit-overflow-scrolling: touch;
  }

  .editor-preview {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 18px;
    background: var(--input-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
    border: 1.5px dashed var(--border);
  }

  .editor-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .editor-preview .ph {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
  }
  .editor-preview .ph ion-icon { font-size: 34px; }
  .editor-preview .ph span { font-size: 13px; font-weight: 600; }

  .editor-field { margin-bottom: 16px; }
  .editor-field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .editor-field input, .editor-field textarea {
    width: 100%;
    background: var(--input-bg);
    border: none;
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  .editor-field textarea { resize: none; min-height: 80px; }

  .type-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .type-chip {
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary);
  }

  .editor-submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--primary);
    color: var(--on-primary);
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    margin-top: 6px;
  }
  .editor-submit:active { opacity: 0.85; }
  .editor-submit:disabled { opacity: 0.4; }

  .toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--primary);
    color: var(--on-primary);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden-file-input { display: none; }
</style>
</head>
<body>

<!-- ===== DRAWER (RIGHT SIDE) ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="logo">Looply</div>
    <button class="icon-tap" onclick="closeDrawer()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <div class="drawer-section">
    <div class="label">Tema</div>
    <div class="theme-toggle">
      <button id="themeDarkBtn" onclick="setTheme('dark')">
        <ion-icon name="moon"></ion-icon> Escuro
      </button>
      <button id="themeLightBtn" onclick="setTheme('light')">
        <ion-icon name="sunny"></ion-icon> Claro
      </button>
    </div>
  </div>

  <div class="drawer-section">
    <div class="label">Chave da API KLIPY</div>
  </div>
  <div class="drawer-field">
    <div class="input-wrap">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input id="apiKeyInput" type="password" placeholder="Cole a tua KLIPY API Key" autocomplete="off" spellcheck="false">
      <button class="icon-tap" style="width:32px;height:32px;font-size:16px;background:transparent;" onclick="toggleVisibility()">
        <ion-icon id="eyeIcon" name="eye-outline"></ion-icon>
      </button>
    </div>
    <button class="drawer-save" onclick="saveKey()">
      <ion-icon name="checkmark-outline"></ion-icon> Guardar chave
    </button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="drawer-item" onclick="openEditor()">
    <ion-icon name="add-circle-outline"></ion-icon> Criar novo conteúdo
  </div>
  <div class="drawer-item" onclick="clearResults()">
    <ion-icon name="trash-outline"></ion-icon> Limpar resultados
  </div>
</div>

<!-- ===== HEADER ===== -->
<header>
  <div class="left">
    <div class="logo">Looply</div>
  </div>
  <div class="header-actions">
    <button class="icon-tap" onclick="openEditor()" aria-label="Criar">
      <ion-icon name="add-circle-outline"></ion-icon>
    </button>
    <button class="icon-tap" onclick="openDrawer()" aria-label="Menu">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
  </div>
</header>

<div class="category-row">
  <button class="pill active" data-type="gifs" onclick="setCategory('gifs', this)">
    <ion-icon name="film-outline"></ion-icon> GIFs
  </button>
  <button class="pill" data-type="stickers" onclick="setCategory('stickers', this)">
    <ion-icon name="happy-outline"></ion-icon> Stickers
  </button>
  <button class="pill" data-type="memes" onclick="setCategory('memes', this)">
    <ion-icon name="chatbox-ellipses-outline"></ion-icon> Memes
  </button>
  <button class="pill" data-type="clips" onclick="setCategory('clips', this)">
    <ion-icon name="videocam-outline"></ion-icon> Clips
  </button>
</div>

<div class="scroll-area">
  <div class="container">
    <div class="search-row">
      <div class="input-wrap">
        <ion-icon name="search-outline"></ion-icon>
        <input id="searchInput" type="text" placeholder="Ex: golo, festa, futebol..." onkeydown="if(event.key==='Enter') newSearch()">
      </div>
      <button class="search-btn" onclick="newSearch()">

    </div>

    <div id="results">
      <div class="empty-state">
        <ion-icon name="images-outline"></ion-icon>
        <div class="es-title">Bem-vindo ao Looply</div>
        <p>Abre o menu, guarda a tua chave e faz uma pesquisa</p>
      </div>
    </div>
  </div>
</div>

<div class="editor-overlay" id="editorOverlay">
  <div class="editor-top">
    <button class="icon-tap" onclick="closeEditor()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h2 id="editorTitle">Novo conteúdo</h2>
  </div>
  <div class="editor-body">
    <div class="editor-preview" id="editorPreviewBox" onclick="triggerFilePick()">
      <img id="editorPreviewImg" src="" alt="" style="display:none">
      <div class="ph" id="editorPreviewPh">
        <ion-icon name="image-outline"></ion-icon>
        <span>Toca para escolher uma imagem</span>
      </div>
    </div>
    <input type="file" id="editorFileInput" class="hidden-file-input" accept="image/*,image/gif" onchange="onEditorFileChosen(event)">

    <div class="editor-field">
      <label>Tipo de conteúdo</label>
      <div class="type-row" id="editorTypeRow">
        <button class="type-chip active" data-t="gifs" onclick="setEditorType('gifs', this)">GIF</button>
        <button class="type-chip" data-t="stickers" onclick="setEditorType('stickers', this)">Sticker</button>
        <button class="type-chip" data-t="memes" onclick="setEditorType('memes', this)">Meme</button>
        <button class="type-chip" data-t="clips" onclick="setEditorType('clips', this)">Clip</button>

      <label>Título</label>
      <input id="editorTitleInput" type="text" placeholder="Dá um título ao teu conteúdo">
    </div>

      <label>Legenda / texto (opcional)</label>
      <textarea id="editorCaptionInput" placeholder="Escreve uma legenda ou o texto do meme..."></textarea>
    </div>

    <button class="editor-submit" id="editorSubmitBtn" onclick="submitEditor()">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <span id="editorSubmitLabel">Publicar</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var API_KEY = '';
  var currentCategory = 'gifs';
  var currentQuery = '';
  var currentPage = 1;
  var isLoading = false;
  var hasMore = true;
  var observer = null;

  // Locally-created content (persists only in-memory for this session)
  var localContent = { gifs: [], stickers: [], memes: [], clips: [] };

  // Current item shown in viewer/editor
  var currentViewerItem = null;
  var editorMode = 'create'; // 'create' | 'edit'
  var editorType = 'gifs';
  var editorImageData = '';
  var editorEditingId = null;

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg, icon) {
    var el = document.getElementById('toast');
    el.innerHTML = '<ion-icon name="' + (icon || 'checkmark-circle-outline') + '"></ion-icon> ' + msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // ---------- Tema ----------
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var color = theme === 'dark' ? '#000000' : '#FFFFFF';

    var meta = document.querySelector('meta[name="theme-color"]');
    meta.setAttribute('content', color);

    if (window.Android) {
      window.Android.setStatusBarColor(color);
      window.Android.setStatusBarLight(theme === 'light');
      window.Android.setNavigationBarColor(color);
    }

    document.getElementById('themeDarkBtn').classList.toggle('active', theme === 'dark');
    document.getElementById('themeLightBtn').classList.toggle('active', theme === 'light');

    localStorage.setItem('looply_theme', theme);
  }

  // ---------- Drawer ----------
  function openDrawer() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }

  // ---------- API Key ----------
  function toggleVisibility() {
    var input = document.getElementById('apiKeyInput');
    var icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('name', 'eye-off-outline');
    } else {
      input.type = 'password';
      icon.setAttribute('name', 'eye-outline');
    }
  }

  function saveKey() {
    var input = document.getElementById('apiKeyInput');
    var status = document.getElementById('statusLine');
    var key = input.value.trim();

    if (!key) {
      status.innerHTML = '<ion-icon name="alert-circle-outline"></ion-icon> Cola uma chave antes de guardar';
      status.className = 'status-line error';
      return;
    }

    API_KEY = key;
    status.innerHTML = '<ion-icon name="checkmark-circle"></ion-icon> Chave guardada — já podes pesquisar';
    status.className = 'status-line ok';
  }

  // ---------- Categorias ----------
  function setCategory(type, btn) {
    document.querySelectorAll('.pill').forEach(function (p) { p.classList.remove('active'); });
    btn.classList.add('active');
    currentCategory = type;
    // Show local feed for this category immediately, then search if a query exists
    renderLocalFeed(type);
    if (currentQuery) newSearch();
  }

  // ---------- Feed local (memes/gifs criados pelo utilizador) ----------
  function renderLocalFeed(type) {
    var items = localContent[type] || [];
    if (!items.length) return; // deixa o empty-state / resultados de pesquisa como estão
    var resultsBox = document.getElementById('results');
    var html = '<div class="grid" id="grid">';
    items.slice().reverse().forEach(function (item) {
      html += buildResultItemHTML(item);
    });
    html += '</div>';
    resultsBox.innerHTML = html;
    bindResultItemClicks();
  }

  function buildResultItemHTML(item) {
    return '<div class="result-item" data-local-id="' + item.id + '" onclick="openViewerFromLocal(\'' + item.id + '\')">'
      + '<img src="' + item.src + '" loading="lazy">'
      + '<div class="result-meta">'
      + '<span><ion-icon name="heart-outline"></ion-icon> ' + (item.likes || 0) + '</span>'
      + '<span><ion-icon name="person-circle-outline"></ion-icon></span>'
      + '</div>'
      + '</div>';
  }

  // ---------- Pesquisa ----------
  function newSearch() {
    var query = document.getElementById('searchInput').value.trim();
    if (!API_KEY) {
      openDrawer();
      var status = document.getElementById('statusLine');
      status.innerHTML = '<ion-icon name="alert-circle-outline"></ion-icon> Guarda a tua chave primeiro';
      status.className = 'status-line error';
      return;
    }
    if (!query) return;

    currentQuery = query;
    currentPage = 1;
    hasMore = true;
    document.getElementById('results').innerHTML = '<div class="grid" id="grid"></div>';
    showSkeleton();
    loadMore();
  }

  function showSkeleton() {
    var grid = document.getElementById('grid');
    if (!grid) return;
    var html = '';
    for (var i = 0; i < 6; i++) html += '<div class="skeleton-item"></div>';
    grid.innerHTML = html;
  }

  function clearResults() {
    currentQuery = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('results').innerHTML = '<div class="empty-state"><ion-icon name="images-outline"></ion-icon><div class="es-title">Sem resultados</div><p>Faz uma nova pesquisa</p></div>';
    closeDrawer();
    renderLocalFeed(currentCategory);
  }

  // CORRIGIDO: extrai a melhor URL de mídia disponível independentemente da categoria
  // (gifs, stickers, memes e clips têm estruturas de resposta ligeiramente diferentes na KLIPY)
  function extractMediaUrl(item) {
    if (!item) return '';
    var file = item.file;
    if (!file) return '';

    // Tenta tamanhos em ordem de preferência
    var sizes = ['sm', 'md', 'hd', 'xs', 'original'];
    for (var i = 0; i < sizes.length; i++) {
      var block = file[sizes[i]];
      if (!block) continue;

      // Formatos possíveis dentro do bloco de tamanho: gif, webp, mp4, url direto, etc.
      var formats = ['gif', 'webp', 'mp4', 'jpg', 'png'];
      for (var j = 0; j < formats.length; j++) {
        var f = block[formats[j]];
        if (f && f.url) return f.url;
      }
      // Alguns endpoints (ex: memes/stickers) devolvem a url diretamente no bloco
      if (block.url) return block.url;
      if (typeof block === 'string') return block;
    }

    // Fallbacks: campos alternativos que a API pode usar consoante o tipo
    if (item.url) return item.url;
    if (item.image) return item.image;
    if (item.preview) return item.preview;
    if (item.thumbnail) return item.thumbnail;

    return '';
  }

  function extractLikes(item) {
    return item.likes || item.stats && item.stats.likes || 0;
  }

  async function loadMore() {
    if (isLoading || !hasMore || !currentQuery) return;
    isLoading = true;

    var grid = document.getElementById('grid');
    if (!grid) return;

    var sentinel = document.createElement('div');
    sentinel.className = 'sentinel';
    sentinel.id = 'sentinel';
    sentinel.innerHTML = '<ion-icon name="reload-outline"></ion-icon> A carregar mais...';
    grid.appendChild(sentinel);

    try {
      var url = 'https://api.klipy.co/api/v1/' + API_KEY + '/' + currentCategory + '/search'
               + '?q=' + encodeURIComponent(currentQuery)
               + '&page=' + currentPage
               + '&per_page=20';

      var response = await fetch(url);
      if (!response.ok) throw new Error('Resposta ' + response.status);

      var data = await response.json();
      var payload = (data.data && data.data.data) || data.data || [];

      var sentinelEl = document.getElementById('sentinel');
      if (sentinelEl) sentinelEl.remove();

      if (currentPage === 1) {
        grid.innerHTML = ''; // remove skeleton
      }

      if (currentPage === 1 && !payload.length) {
        document.getElementById('results').innerHTML = '<div class="empty-state"><ion-icon name="sad-outline"></ion-icon><div class="es-title">Nada encontrado</div><p>Não encontrámos resultados para "' + escapeHtml(currentQuery) + '"</p></div>';
        hasMore = false;
        isLoading = false;
        return;
      }

      if (!payload.length) {
        hasMore = false;
        isLoading = false;
        return;
      }

      payload.forEach(function (item) {
        var src = extractMediaUrl(item);
        if (!src) return; // se mesmo assim não encontrar nada, ignora este item silenciosamente

        var el = document.createElement('div');
        el.className = 'result-item';
        el.setAttribute('data-remote-src', src);
        el.setAttribute('data-remote-likes', extractLikes(item));
        el.onclick = function () { openViewerFromRemote(src, extractLikes(item)); };
        el.innerHTML = '<img src="' + src + '" loading="lazy">'
          + '<div class="result-meta">'
          + '<span><ion-icon name="heart-outline"></ion-icon> ' + extractLikes(item) + '</span>'
          + '<span><ion-icon name="download-outline"></ion-icon></span>'
          + '</div>';
        grid.appendChild(el);
      });

      currentPage++;
      isLoading = false;
      observeSentinel();

    } catch (err) {
      var sentinelEl2 = document.getElementById('sentinel');
      if (sentinelEl2) {
        sentinelEl2.innerHTML = '<ion-icon name="warning-outline"></ion-icon> Erro ao carregar — confirma a chave';
      }
      isLoading = false;
      hasMore = false;
    }
  }

  function observeSentinel() {
    var grid = document.getElementById('grid');
    if (!grid) return;
    var trigger = document.createElement('div');
    trigger.style.gridColumn = '1 / -1';
    trigger.style.height = '1px';
    trigger.id = 'scrollTrigger';
    grid.appendChild(trigger);

    if (observer) observer.disconnect();
    observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        trigger.remove();
        loadMore();
      }
    });
    observer.observe(trigger);
  }

  function bindResultItemClicks() {
    // já vinculado via onclick inline nos itens locais; função mantida para clareza/futura extensão
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Viewer ----------
  function openViewerFromRemote(src, likes) {
    currentViewerItem = { id: null, src: src, likes: likes || 0, type: currentCategory, title: '', caption: '', remote: true };
    showViewer();
  }

  function openViewerFromLocal(id) {
    var items = localContent[currentCategory] || [];
    var found = null;
    Object.keys(localContent).forEach(function (cat) {
      localContent[cat].forEach(function (it) { if (it.id === id) found = it; });
    });
    if (!found) return;
    currentViewerItem = found;
    showViewer();
  }

  function showViewer() {
    if (!currentViewerItem) return;
    document.getElementById('viewerImg').src = currentViewerItem.src;
    document.getElementById('viewerOverlay').classList.add('open');
  }

  function closeViewer() {
    document.getElementById('viewerOverlay').classList.remove('open');
  }

  // ---------- Partilhar ----------
  function openShareSheet() {
    if (!currentViewerItem) return;
    document.getElementById('shareSheetOverlay').classList.add('open');
  }
  function closeShareSheet() {
    document.getElementById('shareSheetOverlay').classList.remove('open');
  }

  async function shareVia(app) {
    if (!currentViewerItem) { closeShareSheet(); return; }
    var src = currentViewerItem.src;
    var text = currentViewerItem.title || 'Vê isto no Looply!';

    closeShareSheet();

    // Tenta usar a Web Share API nativa sempre que possível (funciona melhor em mobile,
    // incluindo apps como WhatsApp/Telegram/Instagram quando o dispositivo suporta)
    if (app === 'more' || navigator.canShare) {
      try {
        var resp = await fetch(src);
        var blob = await resp.blob();
        var ext = blob.type.indexOf('gif') > -1 ? 'gif' : 'png';
        var file = new File([blob], 'looply.' + ext, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Looply', text: text });
          return;
        }
      } catch (e) { /* cai para os fallbacks abaixo */ }
    }

    switch (app) {
      case 'whatsapp':
        window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + src), '_blank');
        break;
      case 'telegram':
        window.open('https://t.me/share/url?url=' + encodeURIComponent(src) + '&text=' + encodeURIComponent(text), '_blank');
        break;
      case 'twitter':
        window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(src), '_blank');
        break;
      case 'email':
        window.open('mailto:?subject=' + encodeURIComponent('Looply') + '&body=' + encodeURIComponent(text + ' ' + src), '_blank');
        break;
      case 'messenger':
      case 'instagram':
        showToast('Copiámos o link — cola-o na app', 'copy-outline');
        copyToClipboard(src);
        break;
      case 'copy':
        copyToClipboard(src);
        showToast('Link copiado', 'checkmark-circle-outline');
        break;
      default:
        showToast('Não foi possível abrir a partilha', 'alert-circle-outline');
    }
  }

  function copyCurrentLink() {
    if (!currentViewerItem) return;
    copyToClipboard(currentViewerItem.src);
    showToast('Link copiado', 'checkmark-circle-outline');
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ---------- Baixar ----------
  async function downloadCurrent() {
    if (!currentViewerItem) return;
    var src = currentViewerItem.src;

    if (window.Android && window.Android.downloadFile) {
      try {
        window.Android.downloadFile(src, 'looply_' + Date.now());
        showToast('A baixar...', 'download-outline');
        return;
      } catch (e) {}
    }

    try {
      var resp = await fetch(src);
      var blob = await resp.blob();
      var ext = blob.type.indexOf('gif') > -1 ? 'gif' : 'png';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'looply_' + Date.now() + '.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      showToast('Ficheiro guardado', 'checkmark-circle-outline');
    } catch (e) {
      showToast('Não foi possível baixar', 'alert-circle-outline');
    }
  }

  // ---------- Editar ----------
  function editCurrent() {
    if (!currentViewerItem) return;
    closeViewer();
    openEditor(currentViewerItem);
  }

  // ---------- Editor (criar / editar) ----------
  function openEditor(itemToEdit) {
    editorMode = itemToEdit ? 'edit' : 'create';
    editorEditingId = itemToEdit && itemToEdit.id ? itemToEdit.id : null;
    editorType = (itemToEdit && itemToEdit.type) || currentCategory || 'gifs';
    editorImageData = (itemToEdit && itemToEdit.src) || '';

    document.getElementById('editorTitle').textContent = editorMode === 'edit' ? 'Editar conteúdo' : 'Novo conteúdo';
    document.getElementById('editorSubmitLabel').textContent = editorMode === 'edit' ? 'Guardar alterações' : 'Publicar';
    document.getElementById('editorTitleInput').value = (itemToEdit && itemToEdit.title) || '';
    document.getElementById('editorCaptionInput').value = (itemToEdit && itemToEdit.caption) || '';

    document.querySelectorAll('#editorTypeRow .type-chip').forEach(function (chip) {
      chip.classList.toggle('active', chip.getAttribute('data-t') === editorType);
    });

    var img = document.getElementById('editorPreviewImg');
    var ph = document.getElementById('editorPreviewPh');
    if (editorImageData) {
      img.src = editorImageData;
      img.style.display = 'block';
      ph.style.display = 'none';
    } else {
      img.src = '';
      img.style.display = 'none';
      ph.style.display = 'flex';
    }

    document.getElementById('editorOverlay').classList.add('open');
    closeDrawer();
  }

  function closeEditor() {
    document.getElementById('editorOverlay').classList.remove('open');
  }

  function setEditorType(type, btn) {
    editorType = type;
    document.querySelectorAll('#editorTypeRow .type-chip').forEach(function (c) { c.classList.remove('active'); });
    btn.classList.add('active');
  }

  function triggerFilePick() {
    document.getElementById('editorFileInput').click();
  }

  function onEditorFileChosen(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      editorImageData = e.target.result;
      var img = document.getElementById('editorPreviewImg');
      var ph = document.getElementById('editorPreviewPh');
      img.src = editorImageData;
      img.style.display = 'block';
      ph.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  function submitEditor() {
    var title = document.getElementById('editorTitleInput').value.trim();
    var caption = document.getElementById('editorCaptionInput').value.trim();

    if (!editorImageData) {
      showToast('Escolhe uma imagem primeiro', 'alert-circle-outline');
      return;
    }
    if (!title) {
      showToast('Dá um título ao teu conteúdo', 'alert-circle-outline');
      return;
    }

    if (editorMode === 'edit' && editorEditingId) {
      // Atualiza item existente (procura em todas as categorias, remove da antiga se o tipo mudou)
      var moved = false;
      Object.keys(localContent).forEach(function (cat) {
        localContent[cat] = localContent[cat].filter(function (it) {
          if (it.id === editorEditingId) {
            if (cat !== editorType) {
              moved = true;
              return false; // remove da categoria antiga
            } else {
              it.title = title;
              it.caption = caption;
              it.src = editorImageData;
              return true;
            }
          }
          return true;
        });
      });
      if (moved) {
        localContent[editorType].push({ id: editorEditingId, src: editorImageData, title: title, caption: caption, likes: 0, type: editorType });
      }
      showToast('Alterações guardadas', 'checkmark-circle-outline');
    } else {
      var newItem = {
        id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        src: editorImageData,
        title: title,
        caption: caption,
        likes: 0,
        type: editorType
      };
      localContent[editorType].push(newItem);
      showToast('Publicado com sucesso', 'checkmark-circle-outline');
    }

    closeEditor();

    // Se a categoria atual é a mesma do item publicado/editado, atualiza o feed
    if (currentCategory === editorType && !currentQuery) {
      renderLocalFeed(editorType);
    }
  }

  // ---------- Inicialização ----------
  var savedTheme = localStorage.getItem('looply_theme') || 'dark';
  setTheme(savedTheme);
</script>

</body>
</html>
