<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0D0F12">
<title>app ao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
  var s=document.createElement('style');
  s.textContent='profile search home home_filled library library_filled menu settings chevron-right language chat back link share lock edit close check check-circle theme trash mail phone clock warning moon sun send'.split(' ').map(function(n){return'.i-'+n+'{--i:url(assets/icons/svg/'+n+'.svg)}'}).join('');
  document.head.appendChild(s);
  function bad(i){
    var p=i.parentNode;if(!p)return;
    if(i.hasAttribute('data-logo'))p.replaceChild(Object.assign(document.createElement('b'),{textContent:'app ao'}),i);
    else if(p.classList.contains('th')){i.remove();p.classList.add('ph')}
    else i.style.display='none'
  }
  document.addEventListener('error',function(e){if(e.target.tagName==='IMG')bad(e.target)},true);
  document.addEventListener('load',function(e){
    var i=e.target;if(i.tagName!=='IMG')return;
    if(i.naturalWidth<40&&!i.classList.contains('lg')&&i.parentNode.classList.contains('th'))bad(i);else i.classList.add('ok')
  },true)
})();
</script>
<style>
:root{--danger:#E5484D;--font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ios:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.22,1,.36,1);--smooth:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1)}
:root[data-theme=dark]{--bg:#0D0F12;--card:#1A1E23;--card2:#22272D;--card-elevated:#22272D;--text:#fff;--dim:#B0B5BC;--text-dim:#B0B5BC;--line:#242830;--border:#242830;--scrim:rgba(0,0,0,.6);--pri:#fff;--primary:#fff;--onpri:#0D0F12;--on-primary:#0D0F12;--pop:#22272D;--shadow:0 18px 44px rgba(0,0,0,.6)}
:root[data-theme=light]{--bg:#fff;--card:#F2F2F2;--card2:#EBEBEB;--card-elevated:#fff;--text:#000;--dim:#666;--text-dim:#666;--line:#E5E5E5;--border:#E5E5E5;--scrim:rgba(0,0,0,.34);--pri:#000;--primary:#000;--onpri:#fff;--on-primary:#fff;--pop:#fff;--shadow:0 18px 44px rgba(0,0,0,.2)}

/* base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{position:fixed;inset:0;color:var(--text);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:active{transition-duration:.08s!important}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
input::-webkit-search-cancel-button{display:none}
h1,h3{margin:0}
.ic{display:inline-block;flex:none;width:22px;height:22px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.drag{transition:none!important}

/* shell */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .45s var(--ios);will-change:transform}
#app.push{transform:translate3d(-22%,0,0)}
#dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .45s var(--ios)}
header{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;height:calc(56px + var(--st));padding:var(--st) 6px 0;flex:none}
.brand{display:flex;justify-content:center;align-items:center;min-width:0}
.brand img{display:block;height:28px;width:auto;max-width:100%}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.6px}
.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .35s var(--spring),background .2s}
.hb:active{transform:scale(.88);background:var(--card)}
.hb .ic{width:23px;height:23px}
.av{position:relative;display:grid;place-items:center;width:34px;height:34px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--card);flex:none}
.av .ic{width:55%;height:55%;color:var(--dim)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* tabs */
#tabs{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.pane.on{opacity:1;visibility:visible;transition:opacity .28s var(--out)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#bar{flex:none;z-index:30;display:flex;height:calc(58px + var(--sb));padding-bottom:var(--sb);background:var(--bg);border-top:1px solid var(--line)}
.bb{flex:1;display:grid;place-items:center;color:var(--dim);transition:color .25s,transform .35s var(--spring)}
.bb .ic{width:25px;height:25px}
.bb:active{transform:scale(.85)}
.bb.on{color:var(--text)}

/* texto */
.h1{font-size:28px;font-weight:800;letter-spacing:-.6px;padding:6px 20px 12px}
.sub{padding:0 20px 8px;margin-top:-8px;font-size:13px;color:var(--dim)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);padding:20px 20px 8px}
.lb{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin:0 4px 8px}
.hint{margin:0;padding:4px 0 12px;font-size:13.5px;line-height:1.55;color:var(--dim)}
.gap{height:14px}
.pills{display:flex;gap:8px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;flex:none}
.pills::-webkit-scrollbar{display:none}
.pill{padding:9px 16px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap;transition:background .3s,color .3s,border-color .3s,transform .3s var(--spring)}
.pill.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.pill:active{transform:scale(.94)}

/* feed com tamanhos variados */
.feed{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:6px 14px 28px;align-items:start}
.nc{display:block;width:100%;min-width:0;text-align:left;transition:transform .35s var(--out)}
.nc:active{transform:scale(.97)}
.th{position:relative;display:block;overflow:hidden;border-radius:18px;background:var(--card)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.th img.ok{opacity:1}
.th img.lg{object-fit:contain;padding:26%}
.th.ph{background:linear-gradient(135deg,var(--card),var(--card2))}
.th.ph::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--dim);opacity:.7}
.tag{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;font-weight:700;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.meta{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;color:var(--dim)}
.meta b{color:var(--text);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{white-space:nowrap;flex:none}
.rg{padding:3px 8px;border-radius:7px;background:var(--card);color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.tt{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;line-height:1.28;letter-spacing:-.15px}
.hero{grid-column:1/-1}
.hero .th{aspect-ratio:16/10;border-radius:22px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.04) 65%)}
.hero .tt{font-size:21px;-webkit-line-clamp:3;color:#fff}
.hero .meta{margin-bottom:7px;color:rgba(255,255,255,.78)}
.hero .meta b{color:#fff}
.half .th{aspect-ratio:4/5}
.half+.half .th{aspect-ratio:1}
.half .meta{margin:10px 2px 5px}
.half .tt{margin:0 2px;font-size:14.5px;-webkit-line-clamp:3}
.row{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}
.row .th{width:104px;aspect-ratio:4/3;border-radius:14px;flex:none}
.row .bd{display:block;flex:1;min-width:0}
.row .meta{margin-bottom:6px}
.row .tt{font-size:15px;-webkit-line-clamp:3}
.lr{grid-column:1/-1;display:flex;align-items:flex-start;gap:6px}
.lr .row{flex:1;min-width:0}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:none;color:var(--dim);transition:background .2s,transform .3s var(--spring)}
.x:active{background:var(--card);transform:scale(.88)}
.x .ic{width:17px;height:17px}
.snt{grid-column:1/-1;height:1px}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
.sk.l{height:14px;margin:0 0 12px;border-radius:8px}
.sk.s{width:60%}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{grid-column:1/-1;padding:64px 28px;text-align:center;color:var(--dim)}
.empty .ic{width:42px;height:42px;margin-bottom:10px;color:var(--text);opacity:.55}
.empty b{display:block;margin-bottom:4px;font-size:16px;color:var(--text)}
.empty p{margin:0 0 16px;font-size:13px;line-height:1.5}
.empty .cta{width:auto;padding:0 24px;margin:0 auto}

/* campos e botões */
.fld{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;height:54px;padding:0 16px;border-radius:18px;background:var(--card);border:1.5px solid transparent;text-align:left;transition:border-color .3s var(--out),background .3s}
.fld:focus-within{border-color:var(--text);background:var(--bg)}
.fld>.ic{width:19px;height:19px;color:var(--dim);transition:color .3s}
.fld:focus-within>.ic{color:var(--text)}
.fld input,.fld select{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;text-align:left;font-size:15px;font-weight:500}
.fld input::placeholder{color:var(--dim);opacity:1}
.fld select{flex:none;width:auto;max-width:98px;font-weight:700;-webkit-appearance:none;appearance:none}
.fld option{color:#000}
.fld .dv{width:1px;height:22px;background:var(--line);flex:none}
.fld span{color:var(--dim);font-size:15px;font-weight:500}
.fld .rq{flex:1;min-width:0;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld[hidden],.qx[hidden]{display:none}
.sf{width:calc(100% - 32px);margin:0 16px 4px;height:50px;border-radius:99px}
.qx{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;flex:none;color:var(--dim)}
.qx .ic{width:16px;height:16px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:18px;background:var(--pri);color:var(--onpri);font-size:15px;font-weight:800;transition:transform .35s var(--spring),opacity .2s}
.cta:active{transform:scale(.97);opacity:.9}
.cta:disabled{opacity:.5;pointer-events:none}
.cta.o{background:none;border:1.5px solid var(--line);color:var(--text)}
.cta.sm{height:46px;border-radius:16px;font-size:14px}
.cta .ic{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.chip{padding:10px 16px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;transition:transform .35s var(--spring),background .2s}
.chip:active{transform:scale(.94);background:var(--card2)}

/* linhas de lista */
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;text-align:left;transition:background .2s}
.rw:active{background:var(--card)}
.rw>.ic:first-child{color:var(--dim)}
.rw .tx{flex:1;min-width:0}
.rw .t{display:block;font-size:14.5px;font-weight:700}
.rw .v{font-size:13px;font-weight:600;color:var(--dim)}
.rw.dg,.rw.dg>.ic:first-child{color:var(--danger)}
.ic.ch{width:16px;height:16px;color:var(--dim);opacity:.6}
.foot{margin:16px 4px 0;font-size:11.5px;line-height:1.5;text-align:center;color:var(--dim)}
.foot b{color:var(--text)}
.lh{display:flex;align-items:center;justify-content:space-between;padding-right:20px}
.lk{font-size:12.5px;font-weight:700}
.rc{display:flex;align-items:center;gap:14px;padding:6px 14px 6px 20px;cursor:pointer}
.rc>.ic{width:19px;height:19px;color:var(--dim)}
.rc span{flex:1;min-width:0;padding:8px 0;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:flex;align-items:center;gap:16px;width:100%;padding:12px 20px;text-align:left;transition:background .2s}
.rk:active{background:var(--card)}
.rk em{width:24px;font-size:20px;font-style:normal;font-weight:800;letter-spacing:-.5px;color:var(--dim)}
.rk span{flex:1;font-size:15px;font-weight:700}

/* páginas empilhadas */
.page{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(100%,0,0);visibility:hidden;box-shadow:-12px 0 32px rgba(0,0,0,.22);transition:transform .45s var(--ios),visibility 0s .45s;will-change:transform}
.page.on{transform:none;visibility:visible;transition:transform .45s var(--ios),visibility 0s}
.page.bk{transform:translate3d(-22%,0,0)}
.pbar{flex:none;display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 6px) 8px 6px}
.ptitle{flex:1;min-width:0;padding-left:4px;font-size:18px;font-weight:800}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
#edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:70;display:none;touch-action:none}
#edge.on{display:block}
.sbar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 6px) 14px 8px 8px}
.sbar .fld{flex:1;height:46px;border-radius:99px}
.form{padding:0 20px}
.avbig{position:relative;display:block;margin:10px auto 20px}
.avbig .av{width:96px;height:96px}
.cam{position:absolute;right:0;bottom:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);background:var(--pri);color:var(--onpri)}
.cam .ic{width:14px;height:14px}

/* artigo */
.ah{margin:6px 16px 0;aspect-ratio:16/10;border-radius:24px}
.am{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 20px 8px;font-size:12px;font-weight:600;color:var(--dim)}
.am b{font-weight:800;color:var(--text)}
.at{padding:0 20px;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
.as{margin:14px 20px 0;padding:14px 16px;border-radius:18px;background:var(--card);font-size:14.5px;line-height:1.6;color:var(--dim)}
.aa{display:flex;gap:10px;padding:16px 20px 2px}
.aa .cta{flex:1}
.ac{padding:18px 20px 4px}
.ac p{margin:0 0 16px;font-size:16px;line-height:1.72}
.ac p.hint{font-size:13.5px;line-height:1.55}
.ac h3{margin:22px 0 10px;font-size:19px;line-height:1.3;font-weight:800;letter-spacing:-.3px}
.ac blockquote{margin:0 0 16px;padding:2px 0 2px 16px;border-left:3px solid var(--text);font-size:16px;line-height:1.65;font-style:italic}
.cmh{display:flex;align-items:center;gap:8px;margin-top:12px;padding:20px 20px 8px;border-top:1px solid var(--line);font-size:16px;font-weight:800}
.cmh .ic{width:20px;height:20px}
#cL{padding-bottom:96px}
#cL .hint{padding:4px 20px 12px}
.cmi{display:flex;gap:12px;padding:10px 20px;animation:pin .45s var(--out)}
@keyframes pin{from{opacity:0;transform:translate3d(0,8px,0)}}
.cmi .av{width:36px;height:36px}
.cmi .bd{flex:1;min-width:0}
.nm{font-size:13px;font-weight:800}
.nm span{margin-left:6px;font-size:11.5px;font-weight:600;color:var(--dim)}
.ct{margin-top:3px;font-size:14.5px;line-height:1.5;word-break:break-word}

/* barra de comentário flutuante */
.article-comment-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:flex;justify-content:center;
  padding:0 14px calc(14px + var(--sb));
  pointer-events:none;
  transform:translate3d(0,140%,0);transition:transform .35s var(--smooth);
}
.article-comment-bar.show{transform:translate3d(0,0,0);}
.cfloat{
  pointer-events:auto;display:flex;align-items:center;
  width:150px;height:48px;padding:0 5px 0 18px;border-radius:999px;
  background:var(--card-elevated);border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:width .5s var(--smooth),background .25s ease;
}
.cfloat.open{width:100%;}
.cfloat input{
  flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;
  color:var(--text);font-size:14.5px;font-family:inherit;
}
.cfloat input::placeholder{color:var(--text-dim);opacity:.9;}
.cfloat-send{
  flex-shrink:0;width:0;height:38px;margin:0;padding:0;border:0;border-radius:50%;overflow:hidden;
  background:var(--pri);color:var(--onpri);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:scale(.4);pointer-events:none;
  transition:width .45s var(--smooth),opacity .25s ease,transform .45s var(--spring);
}
.cfloat.open .cfloat-send{width:38px;opacity:1;transform:scale(1);pointer-events:auto;}
.cfloat-send:active{transform:scale(.9)!important;}
.cfloat-send .ic{width:19px;height:19px;flex-shrink:0;}

/* login */
#auth{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(0,100%,0);visibility:hidden;transition:transform .5s var(--ios),visibility 0s .5s}
#auth.on{transform:none;visibility:visible;transition:transform .5s var(--ios),visibility 0s}
.abar{flex:none;height:calc(52px + var(--st));padding:var(--st) 8px 0}
.abody{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:0 20px calc(28px + var(--sb))}
.a0{padding:2px 0 20px;text-align:center}
.a0 img{height:44px;width:auto;display:block;margin:0 auto}
.a0 b{font-size:30px;font-weight:800;letter-spacing:-.8px}
.a0 p{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--dim)}
.seg{position:relative;display:flex;flex:none;height:48px;margin-bottom:20px;padding:4px;border-radius:18px;background:var(--card)}
.seg>i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:var(--pri);transition:transform .5s var(--ios)}
.seg.r>i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;flex:1;font-size:14px;font-weight:700;color:var(--dim);transition:color .3s}
.seg button.on{color:var(--onpri)}
.vp{flex:none;overflow:hidden}
.track{display:flex;width:200%;align-items:flex-start;transition:transform .5s var(--ios)}
.track.r{transform:translate3d(-50%,0,0)}
.ap{width:50%;padding:0 1px;transition:opacity .35s}
.track:not(.r) .ap:last-child,.track.r .ap:first-child{opacity:0;pointer-events:none}
.idt{display:flex;gap:8px;margin-bottom:10px}
.idt button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--dim);transition:all .3s var(--out)}
.idt button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.err{min-height:20px;padding:10px 4px 6px;font-size:12.5px;font-weight:600;text-align:center;color:var(--danger)}

/* popup, sheet, toast */
#mscrim{position:fixed;inset:0;z-index:499}
.menu{position:fixed;z-index:500;min-width:230px;padding:8px;border-radius:26px;background:var(--pop);box-shadow:var(--shadow);opacity:0;transform:scale(.5);transition:opacity .22s,transform .5s var(--spring)}
.menu.in{opacity:1;transform:none}
.menu.out{opacity:0;transform:scale(.9);transition:opacity .16s,transform .2s var(--out)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:18px;text-align:left;font-size:15px;font-weight:600;opacity:0;transform:translate3d(0,-8px,0);transition:opacity .3s var(--out),transform .45s var(--spring),background .15s}
.menu.in button{opacity:1;transform:none;transition-delay:var(--d),var(--d),0s}

function $(s,r){return(r||document).querySelector(s)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb()
}

  $('#vTheme').textContent={dark:'Escuro',light:'Claro',system:'Sistema'}[m]||'Escuro'
}
if(mq.addEventListener)mq.addEventListener('change',function(){if(S('theme')==='system')theme('system')});

/* ================= POPUP ================= */
var cm=null;
function menu(a,items){
  closeMenu();
  var s=document.createElement('div'),m=document.createElement('div');

  m.innerHTML=items.map(function(o,i){return'<button style="--d:'+(i*35)+'ms" data-k="'+i+'">'+ic(o.i)+'<span>'+esc(o.l)+'</span>'+(o.on?ic('check','ml'):'')+'</button>'}).join('');
  document.body.appendChild(s);document.body.appendChild(m);
  var rect=a.getBoundingClientRect();
  var w=m.offsetWidth,h=m.offsetHeight,vw=innerWidth,vh=innerHeight,gap=12;
  var alignRight=(vw-rect.right)<=rect.left;

}

/* ================= HISTÓRICO / CAMADAS ================= */
var L=[],pend=null;
function layer(close){L.push(close);try{history.pushState({l:L.length},'')}catch(e){}}
function back(then){
  if(!L.length){if(then)then();return}
  pend=then||null;var n=L.length;
  try{history.back()}catch(e){}
  setTimeout(function(){if(L.length===n){var c=L.pop();if(c)c();if(pend){var f=pend;pend=null;f()}}},700)
}
window.addEventListener('popstate',function(){
  var c=L.pop();if(c)c();
  if(pend){var f=pend;pend=null;setTimeout(f,0)}
});
try{history.replaceState({b:1},'')}catch(e){}
window.onNativeBack=function(){if(cm){closeMenu();return true}if(L.length){back();return true}return false};
document.addEventListener('click',function(e){if(e.target.closest('[data-back]'))back()});

/* ================= PÁGINAS EMPILHADAS ================= */
var stack=[],PAGES=['page-search','page-results','pg-article','pg-profile','pg-settings'];
function sync(){
  var n=stack.length;
  $('#app').classList.toggle('push',n>0);
  $('#dim').style.opacity=n?.3:0;
  $('#edge').classList.toggle('on',n>0);
  PAGES.forEach(function(id){
    var i=stack.indexOf(id),p=$('#'+id);
    p.classList.toggle('on',i>-1);p.classList.toggle('bk',i>-1&&i<n-1);p.style.zIndex=60+i
  });
  var bar=$('#articleCommentBar');
  if(bar){
    var inArticle=stack.indexOf('pg-article')>-1;
    bar.classList.toggle('show',inArticle);
    if(!inArticle){var b=$('#cFloat');if(b)b.classList.remove('open');var i=$('#articleCommentInput');if(i)i.blur()}
  }
}
function openPage(id,init){
  if(stack.indexOf(id)>-1)return;
  if(init)init();
  stack.push(id);sync();
  layer(function(){
    var i=stack.lastIndexOf(id);if(i>-1)stack.splice(i,1);sync();
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()
  })
}
function popPage(){back()}
(function(){
  var e=$('#edge'),app=$('#app'),x0=0,dx=0,on=0,p,u,W=1;

    p=$('#'+stack[stack.length-1]);u=stack.length>1?$('#'+stack[stack.length-2]):app;
    x0=t.touches[0].clientX;dx=0;on=1;W=innerWidth;p.classList.add('drag');u.classList.add('drag')
  },{passive:true});
  e.addEventListener('touchmove',function(t){
    if(!on)return;
    dx=Math.max(0,Math.min(W,t.touches[0].clientX-x0));var k=dx/W;
    p.style.transform='translate3d('+dx+'px,0,0)';

    if(u===app)$('#dim').style.opacity=.3*(1-k)
  },{passive:true});
  function end(){
    if(!on)return;on=0;p.classList.remove('drag');u.classList.remove('drag');
    if(dx>W*.3){
      p.style.transform='translate3d(100%,0,0)';u.style.transform='translate3d(0,0,0)';back();
      setTimeout(function(){p.style.transform='';u.style.transform=''},650)
    }else{p.style.transform='';u.style.transform='';if(u===app)$('#dim').style.opacity=.3}
  }
  e.addEventListener('touchend',end);e.addEventListener('touchcancel',end)
})();

/* ================= API / SESSÃO / PERFIL ================= */
function api(p,o){
  o=o||{};var h={'Content-Type':'application/json'},t=S('auth_token');if(t)h.Authorization='Bearer '+t;
  return fetch(API+p,Object.assign({},o,{headers:h})).then(function(r){return r.text().then(function(x){var d;try{d=JSON.parse(x)}catch(e){d={error:'invalid_response'}}return{ok:r.ok,status:r.status,data:d}})})
}

function paint(){

});
$('#rList').addEventListener('click',onCard);

/* ================= BIBLIOTECA ================= */
function lib(){return rd('library',[])}
function saved(id){return lib().some(function(i){return i.id===id})}
function drawLib(){
  var l=lib();
  $('#libN').textContent=l.length?l.length+(l.length===1?' notícia guardada':' notícias guardadas'):'';
  $('#libList').innerHTML=l.length?l.map(function(it){return'<div class="lr">'+card(it,'row')+'<button class="x" data-rm="'+it.id+'" aria-label="Remover">'+ic('trash')+'</button></div>'}).join(''):empty('library','Nada guardado ainda','Guarda notícias para as ler mais tarde.')
}
function syncSave(){$('#aSave .ic').className='ic i-'+(art&&saved(art.id)?'library_filled':'library')}
function toggleSave(){
  if(!art)return;
  var l=lib(),i=-1;l.forEach(function(x,n){if(x.id===art.id)i=n});
  tick();
  if(i>-1){l.splice(i,1);toast('Removido dos guardados','trash')}else{l.unshift(art);toast('Guardado na biblioteca')}
  wr('library',l);drawLib();syncSave()
}
$('#libList').addEventListener('click',function(e){
  var x=e.target.closest('[data-rm]');
  if(x){wr('library',lib().filter(function(i){return i.id!==x.dataset.rm}));drawLib();toast('Removido dos guardados','trash');return}
  onCard(e)
});

/* ================= ARTIGO + COMENTÁRIOS ================= */
function fill(b){$('#aC').innerHTML=b.map(function(x){return x[0]==='h'?'<h3>'+esc(x[1])+'</h3>':x[0]==='q'?'<blockquote>'+esc(x[1])+'</blockquote>':'<p>'+esc(x[1])+'</p>'}).join('')}
function web(it){
  var p=/news\.google\./.test(it.link)?Promise.reject():get(it.link,function(x){return/<p[\s>]/i.test(x)},1).then(function(x){
    var d=new DOMParser().parseFromString(x,'text/html'),o=$('meta[property="og:image"]',d),b=blocks(d);
    if(b.length<2)throw 0;
    return{b:b,i:o&&o.content}
  });
  return p.catch(function(){
    return fetch('https://r.jina.ai/'+it.link).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      var b=md(t),m=/!\[[^\]]*\]\((https?:[^)\s]+)\)/.exec(t);if(b.length<2)throw 0;return{b:b,i:m&&m[1]}
    })
  })
}
function content(it){
  var c=$('#aC');
  if(it.body&&it.body.length>1)return fill(it.body);
  c.innerHTML='<div class="sk l"></div><div class="sk l"></div><div class="sk l"></div><div class="sk l s"></div>';
  web(it).then(function(r){
    if(art!==it)return;
    it.body=r.b;fill(r.b);
    if(!it.image&&r.i){try{it.image=https(new URL(r.i,it.link).href);var h=$('.ah');h.classList.remove('ph');h.insertAdjacentHTML('afterbegin','<img src="'+esc(it.image)+'" alt="" referrerpolicy="no-referrer">')}catch(e){}}
  }).catch(function(){if(art===it)c.innerHTML='<p class="hint">Não foi possível carregar o texto completo aqui. Toca em “Ler original” para abrir a notícia.</p>'})
}
function comments(){return(rd('comments',{})[art.id])||[]}
function drawC(){
  var l=comments();
  $('#cN').textContent=l.length?'('+l.length+')':'';
  $('#cL').innerHTML=l.length?l.map(function(c){return'<div class="cmi"><span class="av">'+ic('profile')+(c.a?'<img src="'+esc(c.a)+'" alt="">':'')+'</span><div class="bd"><div class="nm">'+esc(c.u)+'<span>'+esc(ago(c.d))+'</span></div><div class="ct">'+esc(c.t)+'</div></div></div>'}).join(''):'<p class="hint">Sê o primeiro a comentar esta notícia.</p>'
}
function collapseCommentBar(){
  var input=$('#articleCommentInput');
  var box=$('#cFloat');
  if(input)input.blur();
  if(box)box.classList.remove('open');
}
function sendArticleComment(){
  var i=$('#articleCommentInput'),v=(i&&i.value||'').trim();if(!v||!art)return;
  var u=user(),all=rd('comments',{}),l=all[art.id]||[];
  l.push({u:u?(u.display_name||u.username):'Convidado',a:u&&u.avatar_url&&u.avatar_url.indexOf('data:')!==0?u.avatar_url:'',t:v.slice(0,500),d:new Date().toISOString()});
  all[art.id]=l;wr('comments',all);
  if(i)i.value='';
  tick();drawC();
  var b=$('#aBody');
  if(b)b.scrollTo({top:b.scrollHeight,behavior:'smooth'});
  toast('Comentário enviado','check-circle');
  collapseCommentBar();
}
(function bindCommentFloat(){
  var box=document.getElementById('cFloat');
  var input=document.getElementById('articleCommentInput');
  var send=document.getElementById('cSendBtn');
  if(!box||!input||!send)return;
  input.addEventListener('focus',function(){box.classList.add('open')});
  input.addEventListener('blur',function(){if(!input.value.trim())box.classList.remove('open')});
  input.addEventListener('input',function(){if(input.value.trim())box.classList.add('open')});
  send.addEventListener('mousedown',function(e){e.preventDefault()});
  send.addEventListener('click',function(){sendArticleComment()});
})();
function openArticle(it){
  art=it;
  var rg=it.region==='ao'?'Angola':'Internacional';
  openPage('pg-article',function(){
    $('#aBody').innerHTML='<span class="th ah'+(it.image?'':' ph')+'" data-l="'+esc((it.source||'?').charAt(0).toUpperCase())+'">'+(it.image?'<img src="'+esc(it.image)+'" alt="" referrerpolicy="no-referrer">':'')+'</span>'
      +'<div class="am"><span class="rg">'+rg+'</span><b>'+esc(it.source)+'</b><span>'+esc(ago(it.date))+'</span></div>'
      +'<h1 class="at">'+esc(it.title)+'</h1>'
      +(it.summary?'<p class="as">'+esc(it.summary)+'</p>':'')
      +'<div class="aa"><button class="cta sm" data-open>'+ic('link')+'Ler original</button><button class="cta o sm" data-share>'+ic('share')+'Partilhar</button></div>'
      +'<div class="ac" id="aC"></div><div class="cmh">'+ic('chat')+'<span>Comentários</span><span id="cN"></span></div><div id="cL"></div>';
    $('#aBody').scrollTop=0;
    var inp=$('#articleCommentInput');if(inp)inp.value='';
    var box=$('#cFloat');if(box)box.classList.remove('open');
    paint();syncSave();drawC();content(it)
  })
}
function share(){
  if(!art)return;
  if(has('shareText'))return window.Android.shareText(art.title+' '+art.link,'Partilhar via app ao');
  if(navigator.share)return navigator.share({title:art.title,text:art.summary,url:art.link}).catch(function(){});
  copy(art.link);toast('Link copiado')
}
$('#aBody').addEventListener('click',function(e){
  if(e.target.closest('[data-open]')&&art)openUrl(art.link);
  if(e.target.closest('[data-share]'))share()
});
$('#aSave').onclick=toggleSave;
$('#aShare').onclick=share;

/* ================= DEFINIÇÕES / MENU ================= */
function langLabel(){var c=S('lang')||'pt';$('#vLang').textContent=(LANGS.filter(function(l){return l[0]===c})[0]||LANGS[0])[1]}
$('#sTheme').onclick=function(){
  var c=S('theme')||'dark';
  menu(this,[{i:'moon',l:'Escuro',on:c==='dark',f:function(){theme('dark')}},{i:'sun',l:'Claro',on:c==='light',f:function(){theme('light')}},{i:'phone',l:'Sistema',on:c==='system',f:function(){theme('system')}}])
};
$('#sLang').onclick=function(){
  var c=S('lang')||'pt';
  menu(this,LANGS.map(function(l){return{i:'language',l:l[1],on:c===l[0],f:function(){S('lang',l[0]);langLabel();toast(l[1],'language')}}}))
};
$('#sClr').onclick=function(){sure('Limpar histórico','Isto apaga as tuas pesquisas recentes.','Limpar',function(){clearHist();searchIdle();toast('Histórico limpo','trash')})};
$('#sClrLib').onclick=function(){sure('Limpar guardados','Isto remove todas as notícias guardadas.','Limpar',function(){wr('library',[]);drawLib();toast('Guardados limpos','trash')})};
$('#hMore').onclick=function(){
  menu(this,[{i:'profile',l:'Meu perfil',f:openProfile},{i:'settings',l:'Definições',f:function(){openPage('pg-settings')}},{i:'clock',l:'Atualizar notícias',f:function(){tab('home');load(1)}}])
};

/* ================= TABS ================= */
function tab(t){
  if(TABS.indexOf(t)<0)t='home';
  $$('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t)});
  $$('.bb').forEach(function(b){var on=b.dataset.t===t;b.classList.toggle('on',on);if(b.dataset.f)$('.ic',b).className='ic i-'+(on?b.dataset.f:b.dataset.o)});
  S('active_tab',t);
  if(t==='home'&&!loaded)load();
  if(t==='lib')drawLib()
}
$('#bar').addEventListener('click',function(e){var b=e.target.closest('.bb');if(b&&!b.classList.contains('on')){tick();tab(b.dataset.t)}});

/* ================= INÍCIO ================= */
theme(S('theme')||'dark');
$('#pills').innerHTML=CATS.map(function(c,i){return'<button class="pill'+(i?'':' on')+'" data-c="'+c.id+'">'+c.l+'</button>'}).join('');
$('#track').innerHTML=panel('l')+panel('r');
paint();langLabel();
tab(S('active_tab'));
searchIdle();

})();
</script>
</body>
