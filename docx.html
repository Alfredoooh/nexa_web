<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Looply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --danger:#E5484D;--success:#2AC569;
  --font-main:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-logo:'Grand Hotel',cursive;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --emphasized:cubic-bezier(.2,0,0,1);--emphasized-decel:cubic-bezier(.05,.7,.1,1);--ios:cubic-bezier(.32,.72,0,1);
  --bar-h:58px;--appbar-h:56px;
}
:root[data-theme="dark"]{
  --bg:#0D0D0D;--bg-elevated:#1A1A1A;--card:#1E1E1E;--card-elevated:#272727;
  --text:#FFFFFF;--text-dim:#A8A8A8;--border:#292929;
  --sheet-overlay:rgba(0,0,0,.6);--primary:#FFFFFF;--on-primary:#0D0D0D;
  --input-bg:#1E1E1E;--skeleton:#232323;--statusbar-dim:rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#FFFFFF;--bg-elevated:#F7F7F8;--card:#F1F1F3;--card-elevated:#E8E8EB;
  --text:#0A0A0A;--text-dim:#737373;--border:#ECECEC;
  --sheet-overlay:rgba(0,0,0,.35);--primary:#000000;--on-primary:#FFFFFF;
  --input-bg:#F2F2F2;--skeleton:#EDEDED;--statusbar-dim:rgba(0,0,0,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);height:100%;overflow:hidden;}
html[data-enter="push"] body{animation:pageEnterPush .36s var(--ios) both;}
html[data-enter="pop"] body{animation:pageEnterPop .36s var(--ios) both;}
body.leaving-push{animation:pageLeavePush .22s var(--ios) forwards;}
body.leaving-pop{animation:pageLeavePop .22s var(--ios) forwards;}
@keyframes pageEnterPush{from{transform:translate3d(100%,0,0)}to{transform:translate3d(0,0,0)}}
@keyframes pageLeavePush{from{transform:translate3d(0,0,0)}to{transform:translate3d(-30%,0,0);opacity:.55}}
@keyframes pageEnterPop{from{transform:translate3d(-30%,0,0);opacity:.55}to{transform:translate3d(0,0,0);opacity:1}}
@keyframes pageLeavePop{from{transform:translate3d(0,0,0)}to{transform:translate3d(100%,0,0)}}

body{
  margin:0;padding:0;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  color:var(--text);font-family:var(--font-main);
  -webkit-user-select:none;user-select:none;
  transition:background .2s ease,color .2s ease;
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  height:100%;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;}

.ic{display:inline-block;vertical-align:middle;flex-shrink:0;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}

#statusbar-dim-overlay{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--statusbar-dim);z-index:500;opacity:0;pointer-events:none;transition:opacity .22s ease;}
#statusbar-dim-overlay.on{opacity:1;}

header{display:flex;align-items:center;justify-content:space-between;height:var(--appbar-h);padding:0 6px 0 16px;flex-shrink:0;background:var(--bg);z-index:20;}
.logo{font-family:var(--font-logo);font-size:32px;font-weight:400;color:var(--text);letter-spacing:.5px;line-height:1;}
.icon-tap{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s ease,transform .15s ease;}
.icon-tap:active{background:var(--bg-elevated);transform:scale(.92);}
.icon-tap .ic{width:24px;height:24px;}

.category-row{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.category-row::-webkit-scrollbar{display:none;}
.pill{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:background .15s ease,color .15s ease,border-color .15s ease;}
.pill.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
.pill .ic{width:15px;height:15px;}

.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
.container{padding:0 12px 24px;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.result-item{position:relative;border-radius:14px;overflow:hidden;background:var(--skeleton);cursor:pointer;min-height:140px;}
.result-item img,.result-item video{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--skeleton);}
.rv-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;}
.rv-badge .ic{width:13px;height:13px;color:#fff;}
.result-meta{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);display:flex;align-items:center;justify-content:space-between;}
.result-meta span{color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;}
.result-meta span .ic{width:12px;height:12px;color:#fff;}

.sentinel{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 0;color:var(--text-dim);font-size:13px;}
.sentinel .ic{width:16px;height:16px;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-state{text-align:center;padding:56px 24px;color:var(--text-dim);}
.empty-state .ic{width:44px;height:44px;margin:0 auto 10px;opacity:.5;}
.empty-state p{margin:0;font-size:14px;line-height:1.4;}
.empty-state .es-title{color:var(--text);font-weight:700;font-size:16px;margin-bottom:4px;}
.empty-state .btn-fill{margin-top:18px;}

.btn-fill{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-fill:active{opacity:.85;}
.btn-fill .ic{width:18px;height:18px;background-color:var(--on-primary);}
.btn-outline{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;}

.skeleton-item{border-radius:14px;aspect-ratio:1;background:linear-gradient(90deg,var(--skeleton) 25%,var(--bg-elevated) 50%,var(--skeleton) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

#bottom-bar{position:relative;flex-shrink:0;z-index:30;display:flex;align-items:stretch;height:calc(var(--bar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg);border-top:1px solid var(--border);}
.bb-item{flex:1;min-width:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:color .2s ease,transform .2s var(--emphasized);}
.bb-item:active{transform:scale(.9);}
.bb-item .ic{width:25px;height:25px;}
.bb-item.active{color:var(--primary);}

/* ===== Search tab ===== */
.search-row{display:flex;gap:8px;padding:2px 16px 14px;}
.input-wrap{flex:1;display:flex;align-items:center;gap:10px;background:var(--input-bg);border:none;border-radius:12px;padding:12px 14px;}
.input-wrap .ic{color:var(--text-dim);width:18px;height:18px;flex-shrink:0;}
.input-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;}
.input-wrap input::placeholder{color:var(--text-dim);opacity:.8;}
.search-btn{width:46px;flex-shrink:0;border:none;border-radius:12px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.search-btn:active{opacity:.75;}
.search-btn .ic{width:18px;height:18px;background-color:var(--on-primary);}

.chip-row{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.hist-chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap;border:0;cursor:pointer;flex-shrink:0;}
.hist-chip .ic{width:13px;height:13px;color:var(--text-dim);}

.section-title{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text-dim);padding:6px 16px 10px;}
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 18px;}
.cat-card{position:relative;height:92px;border-radius:18px;overflow:hidden;border:0;text-align:left;color:#fff;padding:13px 15px;font-size:15px;font-weight:800;letter-spacing:-.1px;cursor:pointer;}
.cat-card .ic{position:absolute;right:-4px;bottom:-6px;width:56px;height:56px;opacity:.28;transform:rotate(-14deg);background-color:#fff;}
.cat-card small{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-top:3px;}

/* ===== Library tab ===== */
.lib-filter-row{display:flex;gap:8px;padding:2px 16px 14px;overflow-x:auto;scrollbar-width:none;}
.lib-filter-row::-webkit-scrollbar{display:none;}

/* ===== Account tab ===== */
.acc-field{padding:0 16px 18px;}
.acc-label{font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
.status-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-dim);min-height:16px;}
.status-line .ic{width:15px;height:15px;}
.set-row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:0;color:var(--text);text-align:left;cursor:pointer;transition:background .15s ease;}
.set-row:active{background:var(--bg-elevated);}
.set-row .ic{width:22px;height:22px;color:var(--text-dim);flex-shrink:0;}
.set-txt{flex:1;min-width:0;}
.set-t{font-size:14.5px;font-weight:600;}
.set-s{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
.set-val{font-size:13px;color:var(--text-dim);font-weight:600;flex-shrink:0;max-width:38%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-chev{width:16px!important;height:16px!important;color:var(--text-dim);opacity:.7;}
.set-group-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim);padding:20px 16px 6px;}

.profile-block{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px calc(var(--safe-bottom) + 30px);}
.profile-avatar{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer;margin-bottom:14px;border:2px solid var(--border);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-avatar .ic{width:36px;height:36px;color:var(--text-dim);}
.profile-avatar .avatar-edit-badge{position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
.profile-avatar .avatar-edit-badge .ic{width:13px;height:13px;background-color:var(--on-primary);}
.profile-name{font-size:16.5px;font-weight:800;cursor:pointer;}
.profile-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

/* ===== Add sheet (3 cards) ===== */
.add-cards-row{display:flex;gap:10px;padding:4px 20px 20px;}
.add-card{flex:1;aspect-ratio:1;border-radius:18px;border:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--text);font-size:12px;font-weight:700;text-align:center;padding:8px 4px;cursor:pointer;transition:background .15s ease,transform .15s ease;}
.add-card:active{background:var(--card-elevated);transform:scale(.96);}
.add-card .ic{width:26px;height:26px;color:var(--text);}

/* ===== Sheets (nativos) ===== */
.sheet-layer{position:fixed;inset:0;z-index:100;visibility:hidden;background:rgba(0,0,0,0);display:flex;align-items:flex-end;transition:background .3s linear,visibility 0s linear .42s;}
.sheet-layer.open{visibility:visible;background:var(--sheet-overlay);transition:background .3s linear,visibility 0s;}
.sheet-layer.closing{visibility:visible;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s;}
.sheet-panel{width:100%;max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 0 calc(var(--safe-bottom) + 14px);transform:translate3d(0,100%,0);transition:transform .42s var(--ios);will-change:transform;}
.sheet-layer.open .sheet-panel{transform:translate3d(0,0,0);}
.sheet-layer.closing .sheet-panel{transform:translate3d(0,100%,0);transition:transform .34s var(--ios);}
.sheet-panel.dragging{transition:none!important;}
.sheet-handle-wrap{padding:4px 0 12px;touch-action:none;flex-shrink:0;}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:0 auto;}
.sheet-content{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;}
.sheet-content::-webkit-scrollbar{display:none;}
.sheet-title{font-size:18px;font-weight:800;padding:6px 20px 14px;}
.sheet-item{display:flex;align-items:center;gap:16px;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:15.5px;font-weight:600;text-align:left;width:100%;cursor:pointer;transition:background .15s ease;}
.sheet-item:active{background:var(--bg-elevated);}
.sheet-item .ic{color:var(--text-dim);}
.sheet-item.danger,.sheet-item.danger .ic{color:var(--danger);}
.sheet-sep{height:1px;background:var(--border);margin:6px 0;}
.sheet-input-row{padding:4px 20px 14px;}
.sheet-input-row input{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;outline:none;}
.sheet-input-row input:focus{border-color:var(--primary);}
.sheet-actions{padding:6px 20px 4px;}
.sheet-actions .btn-fill{width:100%;justify-content:center;}
.theme-toggle{display:flex;background:var(--input-bg);border-radius:12px;padding:4px;gap:4px;margin:0 20px 4px;}
.theme-toggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:none;border-radius:9px;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;}
.theme-toggle button.active{background:var(--primary);color:var(--on-primary);}
.theme-toggle button.active .ic{background-color:var(--on-primary);}
.share-apps-row{display:flex;gap:18px;padding:0 20px 18px;overflow-x:auto;scrollbar-width:none;}
.share-apps-row::-webkit-scrollbar{display:none;}
.share-app-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;flex-shrink:0;width:60px;}
.share-app-btn .app-icon{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;}
.share-app-btn .app-icon .ic{width:24px;height:24px;background-color:#fff;}

/* ===== Full-screen viewer ===== */
.page-full{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ios),visibility 0s linear .42s;will-change:transform;}
.page-full.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .42s var(--ios),visibility 0s;}
.viewer-top{display:flex;align-items:center;justify-content:flex-end;padding:calc(var(--safe-top) + 10px) 10px 8px;flex-shrink:0;}
.viewer-top .icon-tap{color:var(--text);background:var(--bg-elevated);}
.viewer-media{flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:4px 20px 10px;max-height:46vh;}
.viewer-media img,.viewer-media video{max-width:100%;max-height:44vh;object-fit:contain;border-radius:18px;background:var(--skeleton);}
.viewer-actions{display:flex;justify-content:space-around;padding:10px 16px 18px;flex-shrink:0;border-bottom:1px solid var(--border);}
.vaction{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:none;color:var(--text);font-size:11px;font-weight:600;cursor:pointer;}
.vaction .vicon{width:48px;height:48px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .15s ease;}
.vaction .vicon .ic{width:21px;height:21px;}
.vaction:active .vicon{transform:scale(.9);background:var(--card-elevated);}
.viewer-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;}
.viewer-details{padding:16px 20px 4px;}
.viewer-title{font-size:19px;font-weight:800;line-height:1.25;}
.viewer-desc{font-size:14px;color:var(--text-dim);line-height:1.5;margin-top:8px;}
.viewer-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.viewer-tag{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:100px;background:var(--card);color:var(--text-dim);}
.viewer-stats{display:flex;gap:16px;margin-top:14px;}
.viewer-stat{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.viewer-stat .ic{width:15px;height:15px;}
.similar-row{display:flex;gap:8px;padding:4px 20px 4px;overflow-x:auto;scrollbar-width:none;}
.similar-row::-webkit-scrollbar{display:none;}
.similar-item{width:118px;flex-shrink:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--skeleton);}
.similar-item img,.similar-item video{width:100%;aspect-ratio:1;object-fit:cover;display:block;}

.hidden-file-input{display:none;}

.toast{position:fixed;bottom:calc(var(--bar-h) + var(--safe-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--on-primary);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .ic{width:16px;height:16px;background-color:var(--on-primary);}
</style>
</head>
<body>

<div id="statusbar-dim-overlay"></div>

<!-- ===== HEADER ===== -->
<header>
  <div class="logo">Looply</div>
  <button class="icon-tap" id="addBtn" aria-label="Criar">
    <span class="ic" style="width:24px;height:24px;-webkit-mask-image:url(assets/icons/svg/add.svg);mask-image:url(assets/icons/svg/add.svg)"></span>
  </button>
</header>

<!-- ===== TAB: HOME ===== -->
<div class="category-row" id="categoryRow">
  <button class="pill active" data-type="gifs" onclick="setHomeCategory('gifs', this)">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/film.svg);mask-image:url(assets/icons/svg/film.svg)"></span> GIFs
  </button>
  <button class="pill" data-type="stickers" onclick="setHomeCategory('stickers', this)">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/happy.svg);mask-image:url(assets/icons/svg/happy.svg)"></span> Stickers
  </button>
  <button class="pill" data-type="memes" onclick="setHomeCategory('memes', this)">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/chat.svg);mask-image:url(assets/icons/svg/chat.svg)"></span> Memes
  </button>
  <button class="pill" data-type="clips" onclick="setHomeCategory('clips', this)">
    <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/video.svg);mask-image:url(assets/icons/svg/video.svg)"></span> Clips
  </button>
</div>
<div class="scroll-area" id="homeScrollArea">
  <div class="container">
    <div id="homeResults"></div>
  </div>
</div>

<!-- ===== TAB: SEARCH ===== -->
<div class="scroll-area" id="searchScrollArea" style="display:none">
  <div class="container">
    <div class="search-row">
      <div class="input-wrap">
        <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/search.svg);mask-image:url(assets/icons/svg/search.svg)"></span>
        <input id="searchInputTab" type="text" placeholder="Pesquisar GIFs, stickers, memes..." onkeydown="if(event.key==='Enter') runSearchTab()">
      </div>
      <button class="search-btn" onclick="runSearchTab()">
        <span class="ic" style="-webkit-mask-image:url(assets/icons/svg/search.svg);mask-image:url(assets/icons/svg/search.svg)"></span>
      </button>
    </div>
    <div id="searchHistoryRow"></div>
    <div id="searchCatSection">
      <div class="section-title">Categorias</div>
      <div id="cat-grid"></div>
    </div>
    <div id="resultsTab"></div>
  </div>
</div>

<!-- ===== TAB: LIBRARY ===== -->
<div class="scroll-area" id="libraryScrollArea" style="display:none">
  <div class="container" style="padding-top:14px">
    <div class="lib-filter-row" id="libFilterRow">

<script>
/* ============== Storage helpers (persistente entre index/criar/editar) ============== */
function loadJSON(key, fb){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function getApiKey(){ return localStorage.getItem('looply_api_key') || ''; }
function setApiKey(k){ localStorage.setItem('looply_api_key', k); }
function getContent(){ return loadJSON('looply_content', {gifs:[],stickers:[],memes:[],clips:[]}); }
function setContent(c){ saveJSON('looply_content', c); }
function getProfile(){ return loadJSON('looply_profile', {name:'Convidado', avatar:''}); }
function setProfile(p){ saveJSON('looply_profile', p); }
function getSearchHistory(){ return loadJSON('looply_search_history', []); }
function addSearchHistory(q){
  q=(q||'').trim(); if(!q) return;
  var h=getSearchHistory().filter(function(x){return x.toLowerCase()!==q.toLowerCase();});
  h.unshift(q); saveJSON('looply_search_history', h.slice(0,10));
}

/* ============== Endpoint map (ajusta aqui se a KLIPY usar outro nome p/ "memes") ============== */
var CATEGORY_ENDPOINTS = { gifs:'gifs', stickers:'stickers', memes:'memes', clips:'clips' };
var HOME_DEFAULT_TERM = 'trending';

/* ============== Native bridge ============== */
var isApp = typeof Android !== 'undefined';
function has(fn){ return isApp && typeof Android[fn] === 'function'; }
function dimStatusBar(on){
  if(has('setStatusBarDimmed')){ try{ Android.setStatusBarDimmed(on); return; }catch(e){} }
  document.getElementById('statusbar-dim-overlay').classList.toggle('on', on);
}

/* ============== Push/pop navegação entre ficheiros ============== */
(function(){
  var nav = sessionStorage.getItem('looply_nav');
  sessionStorage.removeItem('looply_nav');
  if(nav==='push') document.documentElement.setAttribute('data-enter','push');
  else if(nav==='pop') document.documentElement.setAttribute('data-enter','pop');
})();
function goTo(url){
  sessionStorage.setItem('looply_nav','push');
  document.body.classList.add('leaving-push');
  setTimeout(function(){ location.href=url; }, 210);
}
function goBack(fallback){
  sessionStorage.setItem('looply_nav','pop');
  document.body.classList.add('leaving-pop');
  setTimeout(function(){
    if(history.length>1) history.back();
    else location.href = fallback || 'index.html';
  }, 210);
}

/* ============== Toast ============== */
var toastTimer=null;
function showToast(msg, iconFile){
  var el=document.getElementById('toast');
  el.innerHTML='<span class="ic" style="-webkit-mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg);mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg)"></span> '+msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ============== Tema ============== */
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  var color = theme==='dark' ? '#0D0D0D' : '#FFFFFF';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
  if(has('setStatusBarColor')) Android.setStatusBarColor(color);
  if(has('setStatusBarLight')) Android.setStatusBarLight(theme==='light');
  if(has('setNavigationBarColor')) Android.setNavigationBarColor(color);
  localStorage.setItem('looply_theme', theme);
  var lbl=document.getElementById('themeValLabel'); if(lbl) lbl.textContent = theme==='dark' ? 'Escuro' : 'Claro';
}

/* ============== Tabs ============== */
var activeTab='home';
var currentHomeCategory='gifs';
var currentLibFilter='all';

function switchTab(tab){
  document.getElementById('homeScrollArea').style.display='none';
  document.getElementById('searchScrollArea').style.display='none';
  document.getElementById('libraryScrollArea').style.display='none';
  document.getElementById('accountScrollArea').style.display='none';
  document.getElementById('categoryRow').style.display='none';

  activeTab=tab;
  localStorage.setItem('looply_active_tab', tab);
  document.querySelectorAll('.bb-item').forEach(function(b){ b.classList.remove('active'); });
  var btn=document.querySelector('.bb-item[data-tab="'+tab+'"]');
  if(btn) btn.classList.add('active');

  if(tab==='home'){
    document.getElementById('homeScrollArea').style.display='block';
    document.getElementById('categoryRow').style.display='flex';
    if(!homeLoadedOnce) loadHomeFeed(currentHomeCategory);
  } else if(tab==='search'){
    document.getElementById('searchScrollArea').style.display='block';
    renderSearchHistory();
    if(!searchCatGridRendered) renderCategoryGrid();
  } else if(tab==='library'){
    document.getElementById('libraryScrollArea').style.display='block';
    renderLibrary();
  } else if(tab==='account'){
    document.getElementById('accountScrollArea').style.display='block';
  }
}

/* ============== Media helpers ============== */
function isVideoSrc(url){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(url||''); }
function extractMediaUrl(item){
  if(!item) return '';
  var file=item.file;
  if(file){
    var sizes=['sm','md','hd','xs','original'];
    for(var i=0;i<sizes.length;i++){
      var block=file[sizes[i]];
      if(!block) continue;
      var formats=['gif','webp','mp4','jpg','png'];
      for(var j=0;j<formats.length;j++){
        var f=block[formats[j]];
        if(f && f.url) return f.url;
      }
      if(block.url) return block.url;
      if(typeof block==='string') return block;
    }
  }
  if(item.url) return item.url;
  if(item.image) return item.image;
  if(item.preview) return item.preview;
  if(item.thumbnail) return item.thumbnail;
  return '';
}
function extractLikes(item){ return item.likes || (item.stats && item.stats.likes) || 0; }
function extractDetails(item){
  return {
    title: item.title || item.name || (item.tags && item.tags[0]) || 'Sem título',
    description: item.description || item.caption || '',
    tags: item.tags || [],
    likes: extractLikes(item)
  };
}
function mediaTag(src, likes){
  if(isVideoSrc(src)){
    return '<video src="'+src+'" muted playsinline loop autoplay></video><div class="rv-badge"><span class="ic" style="width:13px;height:13px;background-color:#fff;-webkit-mask-image:url(assets/icons/svg/play.svg);mask-image:url(assets/icons/svg/play.svg)"></span></div>';
  }
  return '<img src="'+src+'" loading="lazy">';
}
function resultItemHTML(item){
  var src=item.src, likes=item.likes||0;
  return '<div class="result-item" data-local-id="'+item.id+'" onclick="openViewerFromLocal(\''+item.id+'\')">'
    + mediaTag(src, likes)
    + '<div class="result-meta"><span><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/heart.svg);mask-image:url(assets/icons/svg/heart.svg)"></span> '+likes+'</span></div></div>';
}
function remoteItemHTML(item, category){
  var src=extractMediaUrl(item);
  if(!src) return '';
  var d=extractDetails(item);
  var payload=encodeURIComponent(JSON.stringify({src:src, likes:d.likes, title:d.title, description:d.description, tags:d.tags, type:category, remote:true}));
  return '<div class="result-item" onclick="openViewerFromRemote(\''+payload+'\')">'
    + mediaTag(src, d.likes)
    + '<div class="result-meta"><span><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/heart.svg);mask-image:url(assets/icons/svg/heart.svg)"></span> '+d.likes+'</span></div></div>';
}

/* ============== Fetch genérico (usado por home e pesquisa) ============== */
var homeLoadedOnce=false;
var homePage=1, homeLoading=false, homeHasMore=true, homeResultsCache=[];
function loadHomeFeed(category, reset){
  var key=getApiKey();
  var box=document.getElementById('homeResults');
  if(!key){
    box.innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/lock.svg);mask-image:url(assets/icons/svg/lock.svg)"></span><div class="es-title">Falta a tua chave da API</div><p>Vai à Conta e guarda a tua chave KLIPY para veres conteúdo aqui</p><button class="btn-fill" onclick="switchTab(\'account\')"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/lock.svg);mask-image:url(assets/icons/svg/lock.svg)"></span> Ir à Conta</button></div>';
    homeLoadedOnce=true;
    return;
  }
  if(reset!==false){ homePage=1; homeHasMore=true; homeResultsCache=[]; box.innerHTML='<div class="grid" id="homeGrid"></div>'; showSkeleton('homeGrid'); }
  homeLoadedOnce=true;
  fetchCategoryPage(category, HOME_DEFAULT_TERM, homePage, function(ok, items, errMsg){
    var grid=document.getElementById('homeGrid');
    if(!grid) return;
    if(homePage===1) grid.innerHTML='';
    if(!ok){
      box.innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/warning.svg);mask-image:url(assets/icons/svg/warning.svg)"></span><div class="es-title">Não foi possível carregar</div><p>'+escapeHtml(errMsg||'Verifica a chave ou o endpoint da categoria.')+'</p><button class="btn-outline" onclick="loadHomeFeed(currentHomeCategory)"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/refresh.svg);mask-image:url(assets/icons/svg/refresh.svg)"></span> Recarregar</button></div>';
      return;
    }
    if(homePage===1 && !items.length){
      box.innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/sad.svg);mask-image:url(assets/icons/svg/sad.svg)"></span><div class="es-title">Sem conteúdo disponível</div><p>Não encontrámos nada para esta categoria de momento</p></div>';
      return;
    }
    items.forEach(function(it){ grid.insertAdjacentHTML('beforeend', remoteItemHTML(it, category)); homeResultsCache.push(it); });
    homePage++;
    if(items.length) attachInfiniteScroll(grid, function(){ loadHomeFeed(category, false); }, function(){ return homeHasMore; });
    else homeHasMore=false;
  });
}
function setHomeCategory(type, btn){
  document.querySelectorAll('#categoryRow .pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  currentHomeCategory=type;
  loadHomeFeed(type, true);
}

var searchPage=1, searchLoading=false, searchHasMore=true, searchQuery='', searchCategory='gifs';
function runSearchTab(){
  var q=document.getElementById('searchInputTab').value.trim();
  if(!q) return;
  var key=getApiKey();
  if(!key){ switchTab('account'); return; }
  addSearchHistory(q);
  searchQuery=q; searchPage=1; searchHasMore=true;
  document.getElementById('searchCatSection').style.display='none';
  var box=document.getElementById('resultsTab');
  box.innerHTML='<div class="grid" id="searchGrid"></div>';
  showSkeleton('searchGrid');
  loadSearchPage();
}
function browseCategoryFromSearch(catKey){
  document.getElementById('searchInputTab').value='';
  searchCategory=catKey; searchQuery=HOME_DEFAULT_TERM; searchPage=1; searchHasMore=true;
  document.getElementById('searchCatSection').style.display='none';
  var box=document.getElementById('resultsTab');
  box.innerHTML='<div class="grid" id="searchGrid"></div>';
  showSkeleton('searchGrid');
  loadSearchPage();
}
function loadSearchPage(){
  fetchCategoryPage(searchCategory, searchQuery, searchPage, function(ok, items, errMsg){
    var grid=document.getElementById('searchGrid');
    if(!grid) return;
    if(searchPage===1) grid.innerHTML='';
    if(!ok){
      document.getElementById('resultsTab').innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/warning.svg);mask-image:url(assets/icons/svg/warning.svg)"></span><div class="es-title">Erro na pesquisa</div><p>'+escapeHtml(errMsg||'')+'</p></div>';
      return;
    }
    if(searchPage===1 && !items.length){
      document.getElementById('resultsTab').innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/sad.svg);mask-image:url(assets/icons/svg/sad.svg)"></span><div class="es-title">Nada encontrado</div><p>Tenta outra palavra-chave</p></div>';
      return;
    }
    items.forEach(function(it){ grid.insertAdjacentHTML('beforeend', remoteItemHTML(it, searchCategory)); });
    searchPage++;
    if(items.length) attachInfiniteScroll(grid, loadSearchPage, function(){ return searchHasMore; });
    else searchHasMore=false;
  });
}
function renderSearchHistory(){
  var row=document.getElementById('searchHistoryRow');
  var h=getSearchHistory();
  if(!h.length){ row.innerHTML=''; return; }
  row.innerHTML='<div class="chip-row">'+h.map(function(q,i){
    return '<button class="hist-chip" onclick="document.getElementById(\'searchInputTab\').value=this.dataset.q;runSearchTab();" data-q="'+escapeHtml(q)+'"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/clock.svg);mask-image:url(assets/icons/svg/clock.svg)"></span>'+escapeHtml(q)+'</button>';
  }).join('')+'</div>';
}
var searchCatGridRendered=false;
function renderCategoryGrid(){
  searchCatGridRendered=true;
  var cats=[
    {name:'GIFs', color:'#3E6E92', type:'gifs', icon:'film'},
    {name:'Stickers', color:'#A85A2E', type:'stickers', icon:'happy'},
    {name:'Memes', color:'#7A3FB0', type:'memes', icon:'chat'},
    {name:'Clips', color:'#2F8F6B', type:'clips', icon:'video'},
  ];
  document.getElementById('cat-grid').innerHTML=cats.map(function(c){
    return '<button class="cat-card" style="background:'+c.color+'" onclick="browseCategoryFromSearch(\''+c.type+'\')">'+c.name+'<small>Ver tudo</small><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/'+c.icon+'.svg);mask-image:url(assets/icons/svg/'+c.icon+'.svg)"></span></button>';
  }).join('');
}

/* ============== fetchCategoryPage: chamada real à KLIPY ============== */
function fetchCategoryPage(category, query, page, cb){
  var key=getApiKey();
  var endpoint=CATEGORY_ENDPOINTS[category] || category;
  var url='https://api.klipy.co/api/v1/'+key+'/'+endpoint+'/search'
        +'?q='+encodeURIComponent(query)
        +'&page='+page
        +'&per_page=20';
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var payload=(data.data && data.data.data) || data.data || [];
    cb(true, payload, null);
  }).catch(function(err){
    cb(false, [], 'Endpoint "'+endpoint+'" falhou ('+err.message+'). Confirma o nome em CATEGORY_ENDPOINTS.');
  });
}
function showSkeleton(gridId){
  var grid=document.getElementById(gridId);
  if(!grid) return;
  var html='';
  for(var i=0;i<6;i++) html+='<div class="skeleton-item"></div>';
  grid.innerHTML=html;
}
function attachInfiniteScroll(grid, loadFn, hasMoreFn){
  var trigger=document.getElementById('scrollTrigger-'+grid.id);
  if(trigger) trigger.remove();
  trigger=document.createElement('div');
  trigger.id='scrollTrigger-'+grid.id;
  trigger.style.gridColumn='1/-1'; trigger.style.height='1px';
  grid.appendChild(trigger);
  var obs=new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting && hasMoreFn()){
      trigger.remove(); obs.disconnect(); loadFn();
    }
  });
  obs.observe(trigger);
}
function escapeHtml(str){ var d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function confirmClearResults(){
  openConfirmSheet('Limpar resultados', 'Isto limpa apenas os resultados de pesquisa em ecrã, não a tua biblioteca.', 'Limpar', function(){
    document.getElementById('homeResults').innerHTML='';
    document.getElementById('resultsTab').innerHTML='';
    homeLoadedOnce=false;
    showToast('Resultados limpos','trash');
  });
}

/* ============== Biblioteca ============== */
function setLibFilter(type, btn){
  document.querySelectorAll('#libFilterRow .pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  currentLibFilter=type;
  renderLibrary();
}
function renderLibrary(){
  var box=document.getElementById('libraryResults');
  var content=getContent();
  var all=[];
  var types = currentLibFilter==='all' ? Object.keys(content) : [currentLibFilter];
  types.forEach(function(t){ (content[t]||[]).forEach(function(it){ it.type=t; all.push(it); }); });
  if(!all.length){
    box.innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/albums.svg);mask-image:url(assets/icons/svg/albums.svg)"></span><div class="es-title">A tua biblioteca está vazia</div><p>Tudo o que criares aparece aqui</p><button class="btn-fill" onclick="openAddSheet()"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/add.svg);mask-image:url(assets/icons/svg/add.svg)"></span> Criar conteúdo</button></div>';
    return;
  }
  all.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  box.innerHTML='<div class="grid">'+all.map(resultItemHTML).join('')+'</div>';
}

/* ============== Viewer (página cheia interna) ============== */
var currentViewerItem=null;
function openViewerFromRemote(payloadStr){
  try{ currentViewerItem=JSON.parse(decodeURIComponent(payloadStr)); }catch(e){ return; }
  showViewer();
}
function openViewerFromLocal(id){
  var content=getContent(); var found=null, foundType=null;
  Object.keys(content).forEach(function(t){ content[t].forEach(function(it){ if(it.id===id){ found=it; foundType=t; } }); });
  if(!found) return;
  currentViewerItem=Object.assign({}, found, {type:foundType, remote:false});
  showViewer();
}
function showViewer(){
  if(!currentViewerItem) return;
  var mediaBox=document.getElementById('viewerMedia');
  mediaBox.innerHTML = isVideoSrc(currentViewerItem.src)
    ? '<video src="'+currentViewerItem.src+'" muted playsinline loop autoplay controls></video>'
    : '<img src="'+currentViewerItem.src+'" alt="">';

  var d={ title: currentViewerItem.title||'Sem título', description: currentViewerItem.description||currentViewerItem.caption||'Sem descrição disponível', tags: currentViewerItem.tags||[], likes: currentViewerItem.likes||0 };
  var html='<div class="viewer-title">'+escapeHtml(d.title)+'</div>';
  html+='<div class="viewer-desc">'+escapeHtml(d.description)+'</div>';
  if(d.tags.length) html+='<div class="viewer-tags">'+d.tags.slice(0,8).map(function(tg){return '<span class="viewer-tag">'+escapeHtml(tg)+'</span>';}).join('')+'</div>';
  html+='<div class="viewer-stats"><span class="viewer-stat"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/heart.svg);mask-image:url(assets/icons/svg/heart.svg)"></span>'+d.likes+' gostos</span></div>';
  document.getElementById('viewerDetails').innerHTML=html;

  renderSimilar();

  document.getElementById('viewer-page').classList.add('open');
  dimStatusBar(true);
  pushSheetHistory();
}
function renderSimilar(){
  var pool = currentViewerItem.remote ? homeResultsCache : (getContent()[currentViewerItem.type]||[]);
  var row=document.getElementById('similarRow'), titleEl=document.getElementById('similarTitle');
  if(!pool || !pool.length){ row.innerHTML=''; titleEl.style.display='none'; return; }
  var htmlItems='';
  var count=0;
  pool.forEach(function(it){
    if(count>=10) return;
    var src = currentViewerItem.remote ? extractMediaUrl(it) : it.src;
    if(!src || src===currentViewerItem.src) return;
    var onclickAttr = currentViewerItem.remote
      ? 'openViewerFromRemote(\''+encodeURIComponent(JSON.stringify(Object.assign({}, extractDetails(it), {src:src, type:currentHomeCategory, remote:true})))+'\')'
      : 'openViewerFromLocal(\''+it.id+'\')';
    htmlItems += '<div class="similar-item" onclick="'+onclickAttr+'">'+mediaTag(src)+'</div>';
    count++;
  });
  if(!htmlItems){ row.innerHTML=''; titleEl.style.display='none'; return; }
  row.innerHTML=htmlItems;
  titleEl.style.display='block';
}
function closeViewer(){
  document.getElementById('viewer-page').classList.remove('open');
  dimStatusBar(false);
  historyBackSilently();
}
function editCurrentViewerItem(){
  if(!currentViewerItem) return;
  sessionStorage.setItem('looply_edit_item', JSON.stringify(currentViewerItem));
  closeViewer();
  setTimeout(function(){ goTo('editar.html'); }, 220);
}

/* ============== Histórico (partilhado entre sheets e viewer) ============== */
var ignorePop=0;
function pushSheetHistory(){ try{ history.pushState({looply:1},''); }catch(e){} }
function historyBackSilently(){ ignorePop++; try{ history.back(); }catch(e){ ignorePop=Math.max(0,ignorePop-1); } setTimeout(function(){ ignorePop=Math.max(0,ignorePop-1); }, 700); }
window.addEventListener('popstate', function(){
  if(ignorePop>0){ ignorePop--; return; }
  if(sheetStack.length){ closeSheet(sheetStack[sheetStack.length-1], true); return; }
  var viewer=document.getElementById('viewer-page');
  if(viewer.classList.contains('open')){ closeViewer(); return; }
});
window.onNativeBack = function(){
  if(sheetStack.length){ closeSheet(sheetStack[sheetStack.length-1]); return true; }
  var viewer=document.getElementById('viewer-page');
  if(viewer.classList.contains('open')){ closeViewer(); return true; }
  return false;
};
try{ history.replaceState({base:1},''); }catch(e){}

/* ============== Sheets nativos (drag-to-close) ============== */
var sheetHost=document.getElementById('sheet-host');
var sheetStack=[];
function openSheet(html){
  dimStatusBar(true);
  var layer=document.createElement('div');
  layer.className='sheet-layer';
  layer.innerHTML='<div class="sheet-panel"><div class="sheet-handle-wrap"><div class="sheet-handle"></div></div><div class="sheet-content">'+html+'</div></div>';
  sheetHost.appendChild(layer);
  var entry={layer:layer, panel:layer.querySelector('.sheet-panel'), content:layer.querySelector('.sheet-content'), handle:layer.querySelector('.sheet-handle-wrap')};
  sheetStack.push(entry);
  layer.addEventListener('click', function(e){ if(e.target===layer) closeSheet(entry); });
  bindSheetDrag(entry);
  void layer.offsetWidth;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ layer.classList.add('open'); }); });
  pushSheetHistory();
  return entry;
}
function closeSheet(entry, fromHistory){
  entry=entry||sheetStack[sheetStack.length-1];
  if(!entry) return;
  var i=sheetStack.indexOf(entry); if(i<0) return;
  sheetStack.splice(i,1);
  entry.panel.classList.remove('dragging'); entry.panel.style.transform=''; entry.layer.style.background='';
  entry.layer.classList.remove('open'); entry.layer.classList.add('closing');
  setTimeout(function(){ entry.layer.remove(); }, 440);
  if(!sheetStack.length && !document.getElementById('viewer-page').classList.contains('open')) dimStatusBar(false);
  if(!fromHistory) historyBackSilently();
}
function bindSheetDrag(entry){
  var panel=entry.panel, layer=entry.layer, content=entry.content, handle=entry.handle;
  var startY=0, dy=0, lastY=0, lastT=0, vel=0, dragging=false, fromContent=false;
  function begin(y, fc){ startY=lastY=y; dy=0; vel=0; lastT=performance.now(); dragging=true; fromContent=fc; }
  function move(y, ev){
    if(!dragging) return;
    var delta=y-startY;
    if(fromContent && (content.scrollTop>0 || delta<=0)){ startY=y; return; }
    if(delta<=0){ dy=0; panel.style.transform=''; return; }
    if(ev.cancelable) ev.preventDefault();
    panel.classList.add('dragging');
    var now=performance.now(); vel=(y-lastY)/Math.max(1, now-lastT); lastY=y; lastT=now;
    dy=delta; panel.style.transform='translate3d(0,'+dy+'px,0)';
    layer.style.background='rgba(0,0,0,'+(0.6*(1-Math.min(1,Math.max(0,dy/panel.offsetHeight))))+')';
  }
  function end(){
    if(!dragging) return; dragging=false; panel.classList.remove('dragging');
    if(dy>panel.offsetHeight*0.3 || vel>0.65) closeSheet(entry);
    else { panel.style.transform=''; layer.style.background=''; }
  }
  handle.addEventListener('touchstart', function(e){ begin(e.touches[0].clientY, false); }, {passive:true});
  content.addEventListener('touchstart', function(e){ begin(e.touches[0].clientY, true); }, {passive:true});
  [handle, content].forEach(function(el){
    el.addEventListener('touchmove', function(e){ move(e.touches[0].clientY, e); }, {passive:false});
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  });
}
function sheetItemHTML(action, icon, label, danger){
  return '<button class="sheet-item'+(danger?' danger':'')+'" data-act="'+action+'"><span class="ic" style="width:21px;height:21px;-webkit-mask-image:url(assets/icons/svg/'+icon+'.svg);mask-image:url(assets/icons/svg/'+icon+'.svg)"></span><span>'+label+'</span></button>';
}
function openConfirmSheet(title, msg, actionLabel, onConfirm){
  var html='<div class="sheet-title">'+escapeHtml(title)+'</div><div style="padding:0 20px 16px;font-size:13.5px;color:var(--text-dim);line-height:1.5">'+escapeHtml(msg)+'</div><div class="sheet-actions"><button class="btn-fill" id="confirmBtn">'+escapeHtml(actionLabel)+'</button></div>';
  var entry=openSheet(html);
  entry.content.querySelector('#confirmBtn').addEventListener('click', function(){ closeSheet(entry); onConfirm(); });
}
function openInputSheet(title, currentVal, placeholder, onSave){
  var html='<div class="sheet-title">'+escapeHtml(title)+'</div><div class="sheet-input-row"><input type="text" id="inputSheetField" value="'+escapeHtml(currentVal||'')+'" placeholder="'+escapeHtml(placeholder||'')+'"></div><div class="sheet-actions"><button class="btn-fill" id="inputSheetSave">Guardar</button></div>';
  var entry=openSheet(html);
  var field=entry.content.querySelector('#inputSheetField');
  setTimeout(function(){ field.focus(); }, 220);
  entry.content.querySelector('#inputSheetSave').addEventListener('click', function(){ var v=field.value.trim(); closeSheet(entry); if(v) onSave(v); });
}

    + '<button class="add-card" data-act="post"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/document.svg);mask-image:url(assets/icons/svg/document.svg)"></span><span>Criar publicação</span></button>'

}
document.getElementById('cameraInput').addEventListener('change', function(e){

/* ============== Partilhar ============== */
function openShareSheet(){
  if(!currentViewerItem) return;
  var html='<div class="sheet-title">Partilhar via</div><div class="share-apps-row">'
    + '<button class="share-app-btn" data-share="whatsapp"><span class="app-icon" style="background:#25D366"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/whatsapp.svg);mask-image:url(assets/icons/svg/whatsapp.svg)"></span></span>WhatsApp</button>'
    + '<button class="share-app-btn" data-share="telegram"><span class="app-icon" style="background:#229ED9"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/send.svg);mask-image:url(assets/icons/svg/send.svg)"></span></span>Telegram</button>'
    + '<button class="share-app-btn" data-share="instagram"><span class="app-icon" style="background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/instagram.svg);mask-image:url(assets/icons/svg/instagram.svg)"></span></span>Instagram</button>'
    + '<button class="share-app-btn" data-share="twitter"><span class="app-icon" style="background:#111"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/twitter.svg);mask-image:url(assets/icons/svg/twitter.svg)"></span></span>X</button>'
    + '<button class="share-app-btn" data-share="email"><span class="app-icon" style="background:#EA4335"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/mail.svg);mask-image:url(assets/icons/svg/mail.svg)"></span></span>Email</button>'
    + '</div><div class="sheet-sep"></div>'
    + sheetItemHTML('copy','copy','Copiar link');
  var entry=openSheet(html);
  entry.content.querySelectorAll('[data-share]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(entry); shareVia(b.dataset.share); }); });
  entry.content.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(entry); shareVia(b.dataset.act); }); });
}
async function shareVia(app){
  if(!currentViewerItem) return;
  var src=currentViewerItem.src, text=currentViewerItem.title||'Vê isto no Looply!';
  if(app!=='copy' && navigator.canShare){
    try{
      var resp=await fetch(src); var blob=await resp.blob();
      var ext=blob.type.indexOf('gif')>-1?'gif':(blob.type.indexOf('video')>-1?'mp4':'png');
      var file=new File([blob], 'looply.'+ext, {type:blob.type});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Looply', text:text}); return; }
    }catch(e){}
  }
  switch(app){
    case 'whatsapp': window.open('https://wa.me/?text='+encodeURIComponent(text+' '+src),'_blank'); break;
    case 'telegram': window.open('https://t.me/share/url?url='+encodeURIComponent(src)+'&text='+encodeURIComponent(text),'_blank'); break;
    case 'twitter': window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(src),'_blank'); break;
    case 'email': window.open('mailto:?subject=Looply&body='+encodeURIComponent(text+' '+src),'_blank'); break;
    case 'instagram': showToast('Copiámos o link — cola-o na app','copy'); copyToClipboard(src); break;
    case 'copy': copyToClipboard(src); showToast('Link copiado','check-circle'); break;
  }
}
function copyCurrentLink(){ if(!currentViewerItem) return; copyToClipboard(currentViewerItem.src); showToast('Link copiado','check-circle'); }
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); }); }
  else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
async function downloadCurrent(){
  if(!currentViewerItem) return;
  var src=currentViewerItem.src;
  if(has('downloadFile')){ try{ Android.downloadFile(src, 'looply_'+Date.now()); showToast('A baixar...','download'); return; }catch(e){} }
  try{
    var resp=await fetch(src); var blob=await resp.blob();
    var ext=blob.type.indexOf('gif')>-1?'gif':(blob.type.indexOf('video')>-1?'mp4':'png');
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download='looply_'+Date.now()+'.'+ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    showToast('Ficheiro guardado','check-circle');
  }catch(e){ showToast('Não foi possível baixar','alert'); }
}

/* ============== Conta: chave da API ============== */
function toggleKeyVisibility(){

  if(input.type==='password'){ input.type='text'; icon.style.webkitMaskImage='url(assets/icons/svg/eye-hidden.svg)'; icon.style.maskImage='url(assets/icons/svg/eye-hidden.svg)'; }
  else { input.type='password'; icon.style.webkitMaskImage='url(assets/icons/svg/eye.svg)'; icon.style.maskImage='url(assets/icons/svg/eye.svg)'; }
}
function saveApiKey(){
  var input=document.getElementById('apiKeyInput'), status=document.getElementById('statusLine');
  var key=input.value.trim();
  if(!key){ status.innerHTML='<span class="ic" style="background-color:var(--danger);-webkit-mask-image:url(assets/icons/svg/alert.svg);mask-image:url(assets/icons/svg/alert.svg)"></span> Cola uma chave antes de guardar'; status.style.color='var(--danger)'; return; }
  setApiKey(key);
  status.innerHTML='<span class="ic" style="background-color:var(--success);-webkit-mask-image:url(assets/icons/svg/check-circle.svg);mask-image:url(assets/icons/svg/check-circle.svg)"></span> Chave guardada — já podes ver conteúdo';
  status.style.color='var(--success)';
  homeLoadedOnce=false;
}

function openThemeSheet(){

    + '<button id="themeDarkBtn" data-th="dark"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/theme.svg);mask-image:url(assets/icons/svg/theme.svg)"></span> Escuro</button>'
    + '<button id="themeLightBtn" data-th="light"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/theme.svg);mask-image:url(assets/icons/svg/theme.svg)"></span> Claro</button>'
    + '</div>';
  var entry=openSheet(html);
  entry.content.querySelector('#themeDarkBtn').classList.toggle('active', cur==='dark');
  entry.content.querySelector('#themeLightBtn').classList.toggle('active', cur==='light');

    b.addEventListener('click', function(){
      setTheme(b.dataset.th);
      entry.content.querySelectorAll('[data-th]').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');

(function init(){
