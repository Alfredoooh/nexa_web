<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Looply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --danger:#E5484D;--success:#2AC569;
  --font-main:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-logo:'Grand Hotel',cursive;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --emphasized:cubic-bezier(.2,0,0,1);--emphasized-decel:cubic-bezier(.05,.7,.1,1);--ios:cubic-bezier(.32,.72,0,1);
  --bar-h:58px;--appbar-h:56px;--sheet-r:28px;
}
:root[data-theme="dark"]{
  --bg:#0D0D0D;--bg-elevated:#1A1A1A;--card:#1E1E1E;--card-elevated:#272727;
  --text:#FFFFFF;--text-dim:#A8A8A8;--border:#292929;
  --sheet-overlay:rgba(0,0,0,.6);--primary:#FFFFFF;--on-primary:#0D0D0D;
  --input-bg:#1E1E1E;--skeleton:#232323;--statusbar-dim:rgba(0,0,0,.35);
  --accent-gold:#E0A62B;
}
:root[data-theme="light"]{
  --bg:#FFFFFF;--bg-elevated:#F7F7F8;--card:#F1F1F3;--card-elevated:#E8E8EB;
  --text:#0A0A0A;--text-dim:#737373;--border:#ECECEC;
  --sheet-overlay:rgba(0,0,0,.35);--primary:#000000;--on-primary:#FFFFFF;
  --input-bg:#F2F2F2;--skeleton:#EDEDED;--statusbar-dim:rgba(0,0,0,.15);
  --accent-gold:#B8860B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);height:100%;overflow:hidden;}
body{
  margin:0;padding:0;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  color:var(--text);font-family:var(--font-main);
  -webkit-user-select:none;user-select:none;
  transition:background .2s ease,color .2s ease;
  position:fixed;inset:0;display:flex;flex-direction:column;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}

#statusbar-dim-overlay{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--statusbar-dim);z-index:900;opacity:0;pointer-events:none;transition:opacity .22s ease;}
#statusbar-dim-overlay.on{opacity:1;}

/* ================= ROOT (estrutura fixa: header / tab-content flex / bottom-bar) ================= */
#root{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .38s var(--ios);will-change:transform;overflow:hidden;}
#root.pushed{transform:translate3d(-26%,0,0);}
#root-dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .38s var(--ios);}

header{display:flex;align-items:center;justify-content:space-between;height:var(--appbar-h);padding:0 8px 0 16px;flex-shrink:0;background:var(--bg);z-index:20;}
.logo{font-family:var(--font-logo);font-size:32px;font-weight:400;color:var(--text);letter-spacing:.5px;line-height:1;}
.icon-tap{width:42px;height:42px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s ease,transform .15s ease;}
.icon-tap:active{background:var(--bg-elevated);transform:scale(.92);}
.icon-tap .ic{width:23px;height:23px;}
.header-actions{display:flex;align-items:center;gap:2px;}

.category-row{display:flex;gap:8px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.category-row::-webkit-scrollbar{display:none;}
.pill{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:background .15s ease,color .15s ease,border-color .15s ease;}
.pill.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
.pill .ic{width:15px;height:15px;}

/* ================= Tab content: única área que ocupa o espaço flexível restante ================= */
#tab-content{flex:1;min-height:0;position:relative;}
.tab-pane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.tab-pane.active{display:flex;}
.tab-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
.container{padding:0 12px 24px;}

/* ================= Staggered grid genérico (2 colunas, respeita proporção real do conteúdo) ================= */
.masonry{display:flex;gap:8px;padding:10px 12px 24px;align-items:flex-start;}
.masonry-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.masonry-item{position:relative;border-radius:14px;overflow:hidden;background:var(--skeleton);cursor:pointer;width:100%;}
.masonry-item img,.masonry-item video{width:100%;height:100%;display:block;object-fit:cover;}
.masonry-item .rv-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;}
.masonry-item .rv-badge .ic{width:12px;height:12px;background-color:#fff;}
.masonry-like-btn{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.masonry-like-btn .ic{width:15px;height:15px;color:#fff;}
.masonry-like-btn.liked .ic{color:var(--danger);background-color:var(--danger);}
.masonry-caption{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 8px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);}
.masonry-caption .mc-title{color:#fff;font-size:12px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.sentinel{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 0;color:var(--text-dim);font-size:13px;width:100%;}
.sentinel .ic{width:16px;height:16px;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-state{text-align:center;padding:56px 24px;color:var(--text-dim);}
.empty-state .ic{width:44px;height:44px;margin:0 auto 10px;opacity:.5;}
.empty-state p{margin:0;font-size:14px;line-height:1.4;}
.empty-state .es-title{color:var(--text);font-weight:700;font-size:16px;margin-bottom:4px;}
.empty-state .btn-fill{margin-top:18px;}

.btn-fill{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-fill:active{opacity:.85;}
.btn-fill .ic{width:18px;height:18px;background-color:var(--on-primary);}
.btn-outline{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;}

.skeleton-masonry-item{border-radius:14px;background:linear-gradient(90deg,var(--skeleton) 25%,var(--bg-elevated) 50%,var(--skeleton) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;width:100%;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ================= BOTTOM BAR (fixo, 4 itens, nunca recriado) ================= */
#bottom-bar{flex-shrink:0;z-index:30;display:flex;align-items:stretch;height:calc(var(--bar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg);border-top:1px solid var(--border);}
.bb-item{flex:1;min-width:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:transform .2s var(--emphasized);}
.bb-item:active{transform:scale(.9);}
.bb-item .ic{width:25px;height:25px;}
.bb-item.active{color:var(--primary);}
.bb-item-profile{padding:0;}
.bb-profile-avatar{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;transition:border-color .2s ease;}
.bb-profile-avatar img{width:100%;height:100%;object-fit:cover;}
.bb-item.active .bb-profile-avatar{border-color:var(--primary);}
.bb-profile-avatar .ic{width:16px;height:16px;}

/* ================= Search tab (entrada) ================= */
.search-row{padding:6px 16px 8px;}
.input-wrap-round{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:none;border-radius:999px;padding:13px 18px;cursor:pointer;width:100%;}
.input-wrap-round .ic{color:var(--text-dim);width:18px;height:18px;flex-shrink:0;}
.input-wrap-round span{color:var(--text-dim);font-size:14.5px;flex:1;text-align:left;}

.section-title{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--text-dim);padding:6px 16px 10px;}
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 18px;}
.cat-card{position:relative;height:92px;border-radius:18px;overflow:hidden;border:0;text-align:left;color:#fff;padding:13px 15px;font-size:15px;font-weight:800;letter-spacing:-.1px;cursor:pointer;}
.cat-card .ic{position:absolute;right:-4px;bottom:-6px;width:56px;height:56px;opacity:.28;transform:rotate(-14deg);background-color:#fff;}
.cat-card small{display:block;font-size:11.5px;font-weight:700;opacity:.85;margin-top:3px;}

/* ================= Search overlay (dedicado; bottom bar continua visível por baixo) ================= */
#search-overlay{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translate3d(0,100%,0);visibility:hidden;transition:transform .32s var(--ios),visibility 0s linear .32s;}
#search-overlay.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .32s var(--ios),visibility 0s;}
.search-overlay-bar{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-top) + 10px) 12px 10px;flex-shrink:0;background:var(--bg);}
.search-overlay-input-wrap{flex:1;display:flex;align-items:center;gap:10px;background:var(--input-bg);border-radius:999px;padding:12px 16px;}
.search-overlay-input-wrap .ic{color:var(--text-dim);width:17px;height:17px;flex-shrink:0;}
.search-overlay-input-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14.5px;font-family:inherit;}
.search-overlay-input-wrap input::placeholder{color:var(--text-dim);opacity:.8;}
.search-overlay-cancel{border:0;background:transparent;color:var(--primary);font-size:14px;font-weight:700;padding:8px 4px;cursor:pointer;flex-shrink:0;}
.search-overlay-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.suggest-row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;}
.suggest-row:active{background:var(--bg-elevated);}
.suggest-row .ic{width:19px;height:19px;color:var(--text-dim);flex-shrink:0;}
.suggest-row span{font-size:14.5px;font-weight:500;flex:1;}
.suggest-remove{width:30px;height:30px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.suggest-remove .ic{width:15px;height:15px;color:var(--text-dim);}

.result-filter-row{display:flex;gap:8px;padding:2px 16px 12px;overflow-x:auto;scrollbar-width:none;}
.result-filter-row::-webkit-scrollbar{display:none;}

/* ================= Library tab ================= */
.lib-filter-row{display:flex;gap:8px;padding:2px 16px 14px;overflow-x:auto;scrollbar-width:none;}
.lib-filter-row::-webkit-scrollbar{display:none;}

/* ================= Profile tab ================= */
.profile-header{padding:14px 20px 6px;flex-shrink:0;}
.profile-top-row{display:flex;align-items:center;gap:22px;}
.profile-avatar-lg{width:82px;height:82px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:2px solid var(--border);position:relative;cursor:pointer;}
.profile-avatar-lg img{width:100%;height:100%;object-fit:cover;}
.profile-avatar-lg .ic{width:34px;height:34px;color:var(--text-dim);}
.profile-stats-row{flex:1;display:flex;justify-content:space-around;}
.profile-stat{text-align:center;}
.profile-stat b{font-size:17px;font-weight:800;display:block;}
.profile-stat span{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.profile-name-block{margin-top:14px;}
.profile-name-block .pname{font-size:15.5px;font-weight:800;}
.profile-name-block .pbio{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.profile-edit-btn{margin-top:14px;width:100%;height:38px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;}
.profile-edit-btn:active{background:var(--bg-elevated);}

/* ================= Sheets (nativos, mais curvos) ================= */
.sheet-layer{position:fixed;inset:0;z-index:100;visibility:hidden;background:rgba(0,0,0,0);display:flex;align-items:flex-end;transition:background .3s linear,visibility 0s linear .42s;}
.sheet-layer.open{visibility:visible;background:var(--sheet-overlay);transition:background .3s linear,visibility 0s;}
.sheet-layer.closing{visibility:visible;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s;}
.sheet-panel{width:100%;max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border-radius:var(--sheet-r) var(--sheet-r) 0 0;padding:10px 0 calc(var(--safe-bottom) + 14px);transform:translate3d(0,100%,0);transition:transform .42s var(--ios);will-change:transform;}
.sheet-layer.open .sheet-panel{transform:translate3d(0,0,0);}
.sheet-layer.closing .sheet-panel{transform:translate3d(0,100%,0);transition:transform .34s var(--ios);}
.sheet-panel.dragging{transition:none!important;}
.sheet-handle-wrap{padding:4px 0 12px;touch-action:none;flex-shrink:0;}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:0 auto;}
.sheet-content{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;}
.sheet-content::-webkit-scrollbar{display:none;}
.sheet-title{font-size:18px;font-weight:800;padding:6px 20px 14px;}
.sheet-item{display:flex;align-items:center;gap:16px;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:15.5px;font-weight:600;text-align:left;width:100%;cursor:pointer;transition:background .15s ease;}
.sheet-item:active{background:var(--bg-elevated);}
.sheet-item .ic{color:var(--text-dim);}
.sheet-item.danger,.sheet-item.danger .ic{color:var(--danger);}
.sheet-sep{height:1px;background:var(--border);margin:6px 0;}
.sheet-input-row{padding:4px 20px 14px;}
.sheet-input-row input,.sheet-input-row textarea{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;outline:none;font-family:inherit;}
.sheet-input-row input:focus,.sheet-input-row textarea:focus{border-color:var(--primary);}
.sheet-actions{padding:6px 20px 4px;}
.sheet-actions .btn-fill{width:100%;justify-content:center;}
.theme-toggle{display:flex;background:var(--input-bg);border-radius:14px;padding:4px;gap:4px;margin:0 20px 4px;}
.theme-toggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:none;border-radius:11px;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;}
.theme-toggle button.active{background:var(--primary);color:var(--on-primary);}
.theme-toggle button.active .ic{background-color:var(--on-primary);}
.share-apps-row{display:flex;gap:18px;padding:0 20px 18px;overflow-x:auto;scrollbar-width:none;}
.share-apps-row::-webkit-scrollbar{display:none;}
.share-app-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;flex-shrink:0;width:60px;}
.share-app-btn .app-icon{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;}
.share-app-btn .app-icon .ic{width:24px;height:24px;background-color:#fff;}
.add-cards-row{display:flex;gap:10px;padding:4px 20px 20px;}
.add-card{flex:1;aspect-ratio:1;border-radius:20px;border:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--text);font-size:12px;font-weight:700;text-align:center;padding:8px 4px;cursor:pointer;transition:background .15s ease,transform .15s ease;}
.add-card:active{background:var(--card-elevated);transform:scale(.96);}
.add-card .ic{width:26px;height:26px;color:var(--text);}

/* ================= Full pages (push) ================= */
.page{position:absolute;inset:0;z-index:60;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ios),visibility 0s linear .42s;will-change:transform;}
.page.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .42s var(--ios),visibility 0s;}
.page.behind{transform:translate3d(-26%,0,0);visibility:visible;}
.page.leaving{transform:translate3d(100%,0,0);visibility:visible;transition:transform .36s var(--ios),visibility 0s linear .36s;}
.page.dragging{transition:none!important;}
.page-bar{flex-shrink:0;padding:calc(var(--safe-top) + 10px) 8px 8px;display:flex;align-items:center;gap:2px;background:var(--bg);}
.page-back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.page-back .ic{width:24px;height:24px;}
.page-back:active{background:var(--bg-elevated);}
.page-title{font-size:18px;font-weight:800;flex:1;}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px;}
#swipe-edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:65;display:none;touch-action:none;}
#swipe-edge.on{display:block;}

/* ================= Viewer page (detalhes) ================= */
.viewer-media-lg{width:100%;padding:6px 16px 14px;flex-shrink:0;}
.viewer-media-lg .inner{position:relative;width:100%;border-radius:22px;overflow:hidden;background:var(--skeleton);display:flex;align-items:center;justify-content:center;max-height:52vh;}
.viewer-media-lg img,.viewer-media-lg video{width:100%;max-height:52vh;object-fit:contain;display:block;}
.viewer-actions-row{display:flex;align-items:center;gap:10px;padding:2px 20px 16px;}
.viewer-like-big{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s var(--emphasized),background .15s ease;}
.viewer-like-big:active{transform:scale(.88);}
.viewer-like-big .ic{width:22px;height:22px;color:var(--text);}
.viewer-like-big.liked .ic{color:var(--danger);background-color:var(--danger);}
.viewer-action-pill{flex:1;height:48px;border-radius:14px;border:0;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;}
.viewer-action-pill:active{background:var(--card-elevated);}
.viewer-action-pill .ic{width:18px;height:18px;}
.viewer-details{padding:2px 20px 6px;}
.viewer-title{font-size:20px;font-weight:800;line-height:1.25;}
.viewer-desc{font-size:14px;color:var(--text-dim);line-height:1.55;margin-top:9px;}
.viewer-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
.viewer-tag{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:100px;background:var(--card);color:var(--text-dim);}
.similar-section-title{padding:22px 20px 12px;font-size:15px;font-weight:800;}

/* ================= Settings / Edit profile page ================= */
.set-row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:0;color:var(--text);text-align:left;cursor:pointer;transition:background .15s ease;}
.set-row:active{background:var(--bg-elevated);}
.set-row .ic{width:22px;height:22px;color:var(--text-dim);flex-shrink:0;}
.set-txt{flex:1;min-width:0;}
.set-t{font-size:14.5px;font-weight:600;}
.set-s{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
.set-val{font-size:13px;color:var(--text-dim);font-weight:600;flex-shrink:0;max-width:38%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-chev{width:16px!important;height:16px!important;color:var(--text-dim);opacity:.7;}
.set-group-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim);padding:20px 16px 6px;}

.acc-field{padding:14px 16px 4px;}
.acc-avatar-edit{display:flex;justify-content:center;padding:20px 16px 18px;}
.acc-avatar-edit .profile-avatar-lg{width:96px;height:96px;}
.acc-label{font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px;}
.input-wrap{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:none;border-radius:14px;padding:13px 16px;}

.toast{position:fixed;bottom:calc(var(--bar-h) + var(--safe-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:var(--on-primary);padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .ic{width:16px;height:16px;background-color:var(--on-primary);}
</style>

<script>
/* ============== Storage ============== */
function loadJSON(key, fb){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function getApiKey(){ return localStorage.getItem('looply_api_key') || ''; }
function setApiKeyLS(k){ localStorage.setItem('looply_api_key', k); }
function getContent(){ return loadJSON('looply_content', {gifs:[],stickers:[],memes:[],clips:[]}); }
function setContent(c){ saveJSON('looply_content', c); }
function getProfile(){ return loadJSON('looply_profile', {name:'Convidado', avatar:''}); }
function setProfile(p){ saveJSON('looply_profile', p); }
function getSearchHistory(){ return loadJSON('looply_search_history', []); }
function addSearchHistory(q){
  q=(q||'').trim(); if(!q) return;
  var h=getSearchHistory().filter(function(x){return x.toLowerCase()!==q.toLowerCase();});
  h.unshift(q); saveJSON('looply_search_history', h.slice(0,30));
}
function removeSearchHistory(q){ saveJSON('looply_search_history', getSearchHistory().filter(function(x){return x!==q;})); }
function getLikes(){ return loadJSON('looply_likes', {}); }
function setLikeState(srcKey, liked){ var l=getLikes(); if(liked) l[srcKey]=true; else delete l[srcKey]; saveJSON('looply_likes', l); }
function isLiked(srcKey){ return !!getLikes()[srcKey]; }
function likeKeyFor(src){ return 'k_'+(src||'').slice(0,120); }

var CATEGORY_ENDPOINTS = { gifs:'gifs', stickers:'stickers', memes:'memes', clips:'clips' };
var HOME_DEFAULT_TERM = 'trending';

var isApp = typeof Android !== 'undefined';
function has(fn){ return isApp && typeof Android[fn] === 'function'; }
function dimStatusBar(on){
  if(has('setStatusBarDimmed')){ try{ Android.setStatusBarDimmed(on); return; }catch(e){} }
  document.getElementById('statusbar-dim-overlay').classList.toggle('on', on);
}

/* ============== Toast ============== */
var toastTimer=null;
function showToast(msg, iconFile){
  var el=document.getElementById('toast');
  el.innerHTML='<span class="ic" style="-webkit-mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg);mask-image:url(assets/icons/svg/'+(iconFile||'check-circle')+'.svg)"></span> '+msg;
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* ============== Tema ============== */
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  var color = theme==='dark' ? '#0D0D0D' : '#FFFFFF';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
  if(has('setStatusBarColor')) Android.setStatusBarColor(color);
  if(has('setStatusBarLight')) Android.setStatusBarLight(theme==='light');
  if(has('setNavigationBarColor')) Android.setNavigationBarColor(color);
  localStorage.setItem('looply_theme', theme);
  var lbl=document.getElementById('themeValLabel'); if(lbl) lbl.textContent = theme==='dark' ? 'Escuro' : 'Claro';
}

/* ============================================================
   BOTÃO DE AÇÃO DO APPBAR — um único nó fixo (#actionBtn),
   nunca recriado. Cada tab só troca o ícone/handler dele.
   ============================================================ */
var actionBtnEl = document.getElementById('actionBtn');
function setActionBtn(iconFile, label, handler){
  actionBtnEl.setAttribute('aria-label', label);
  actionBtnEl.innerHTML = '<span class="ic" style="width:23px;height:23px;-webkit-mask-image:url(assets/icons/svg/'+iconFile+'.svg);mask-image:url(assets/icons/svg/'+iconFile+'.svg)"></span>';
  actionBtnEl.onclick = handler;
}

/* ============== Tabs (4 panes fixos, nunca recriados) ============== */
var activeTab='home';
var currentHomeCategory='gifs';
var currentLibFilter='all';
var mixAllOn=false;

var TAB_ACTION = {
  home:    function(){ setActionBtn('add','Criar', openAddSheet); },
  search:  function(){ setActionBtn('add','Criar', openAddSheet); },
  library: function(){ setActionBtn('clock','Histórico', function(){ goToPage('history'); }); },
  profile: function(){ setActionBtn('settings','Definições', function(){ goToPage('settings'); }); }
};

function switchTab(tab){
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('pane-'+tab).classList.add('active');

  activeTab=tab;
  localStorage.setItem('looply_active_tab', tab);
  document.querySelectorAll('.bb-item').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('.bb-item[data-tab="'+tab+'"]').classList.add('active');
  syncBbIcons(tab);
  TAB_ACTION[tab]();

  if(tab==='home' && !homeLoadedOnce) loadHomeFeed(currentHomeCategory, true);
  if(tab==='search' && !searchCatGridRendered) renderCategoryGrid();
  if(tab==='library') renderLibrary();
  if(tab==='profile') renderProfileTab();
}
function syncBbIcons(tab){
  var homeIc=document.querySelector('.bb-ic-home');
  homeIc.style.webkitMaskImage='url(assets/icons/svg/'+(tab==='home'?'home_filled':'home')+'.svg)';
  homeIc.style.maskImage='url(assets/icons/svg/'+(tab==='home'?'home_filled':'home')+'.svg)';
  var libIc=document.querySelector('.bb-ic-library');
  libIc.style.webkitMaskImage='url(assets/icons/svg/'+(tab==='library'?'library_filled':'library')+'.svg)';
  libIc.style.maskImage='url(assets/icons/svg/'+(tab==='library'?'library_filled':'library')+'.svg)';
}

/* ============== Media helpers ============== */
function isVideoSrc(url){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(url||''); }
function extractMediaUrl(item){
  if(!item) return '';
  var file=item.file;
  if(file){
    var sizes=['sm','md','hd','xs','original'];
    for(var i=0;i<sizes.length;i++){
      var block=file[sizes[i]];
      if(!block) continue;
      var formats=['gif','webp','mp4','jpg','png'];
      for(var j=0;j<formats.length;j++){
        var f=block[formats[j]];
        if(f && f.url) return f.url;
      }
      if(block.url) return block.url;
      if(typeof block==='string') return block;
    }
  }
  if(item.url) return item.url;
  if(item.image) return item.image;
  if(item.preview) return item.preview;
  if(item.thumbnail) return item.thumbnail;
  return '';
}
function extractDims(item){
  var file=item.file, sizes=['md','sm','hd','original'];
  if(file){
    for(var i=0;i<sizes.length;i++){
      var block=file[sizes[i]];
      if(block){
        var formats=['gif','webp','mp4','jpg','png'];
        for(var j=0;j<formats.length;j++){
          var f=block[formats[j]];
          if(f && f.width && f.height) return {w:f.width, h:f.height};
        }
      }
    }
  }
  if(item.width && item.height) return {w:item.width, h:item.height};
  return null;
}
function extractDetails(item){
  return {
    title: item.title || item.name || (item.tags && item.tags[0]) || 'Sem título',
    description: item.description || item.caption || '',
    tags: item.tags || []
  };
}
function mediaThumbStatic(src){
  if(isVideoSrc(src)) return '<video src="'+src+'" muted playsinline></video>';
  return '<img src="'+src+'" loading="lazy">';
}
function toggleLikeInline(btn, key){
  var liked=btn.classList.toggle('liked');
  setLikeState(key, liked);
}

/* ============================================================
   STAGGERED GRID (masonry) — respeita a proporção REAL do
   conteúdo (dimensões vindas da API, ou medidas do ficheiro
   local via naturalWidth/naturalHeight quando desconhecidas)
   ============================================================ */
function stableFallbackRatio(id){
  var h=0; for(var i=0;i<id.length;i++){ h=(h*31+id.charCodeAt(i))>>>0; }
  var ratios=[1, 1.25, 0.8, 1.4, 1.1];
  return ratios[h % ratios.length];
}
function buildMasonryItemHTML(entry){
  // entry: {id, src, ratio(h/w) opcional, title, isVideo, liked, likeKey, onclick}
  var ratio = entry.ratio || stableFallbackRatio(String(entry.id||entry.src));
  var mediaHtml = entry.isVideo
    ? '<video src="'+entry.src+'" muted playsinline></video><div class="rv-badge"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/play.svg);mask-image:url(assets/icons/svg/play.svg)"></span></div>'
    : '<img src="'+entry.src+'" loading="lazy">';
  var likeBtn = entry.likeKey
    ? '<button class="masonry-like-btn'+(entry.liked?' liked':'')+'" onclick="event.stopPropagation();toggleLikeInline(this,\''+entry.likeKey.replace(/'/g,"\\'")+'\')"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/heart.svg);mask-image:url(assets/icons/svg/heart.svg)"></span></button>'
    : '';
  var caption = entry.title
    ? '<div class="masonry-caption"><div class="mc-title">'+escapeHtml(entry.title)+'</div></div>'
    : '';
  return '<div class="masonry-item" style="aspect-ratio:1/'+ratio+'" onclick="'+entry.onclick+'">'+mediaHtml+caption+likeBtn+'</div>';
}
function renderMasonryList(box, entries){
  var colA=[], colB=[], hA=0, hB=0;
  entries.forEach(function(entry){
    if(!entry.src) return;
    var ratio = entry.ratio || stableFallbackRatio(String(entry.id||entry.src));
    var html = buildMasonryItemHTML(entry);
    if(hA<=hB){ colA.push(html); hA+=ratio; } else { colB.push(html); hB+=ratio; }
  });
  box.innerHTML = '<div class="masonry-col">'+colA.join('')+'</div><div class="masonry-col">'+colB.join('')+'</div>';
}
function showMasonrySkeleton(box, count){
  var colA=[], colB=[], hA=0, hB=0;
  var ratios=[1,1.3,0.85,1.15,0.95,1.25];
  for(var i=0;i<count;i++){
    var r=ratios[i%ratios.length];
    var html='<div class="skeleton-masonry-item" style="aspect-ratio:1/'+r+'"></div>';
    if(hA<=hB){ colA.push(html); hA+=r; } else { colB.push(html); hB+=r; }
  }
  box.innerHTML='<div class="masonry-col">'+colA.join('')+'</div><div class="masonry-col">'+colB.join('')+'</div>';
}

function remoteEntry(item, category){
  var src=extractMediaUrl(item);
  if(!src) return null;
  var d=extractDetails(item);
  var dims=extractDims(item);
  var key=likeKeyFor(src);
  var payload=encodeURIComponent(JSON.stringify({src:src, title:d.title, description:d.description, tags:d.tags, type:category, remote:true}));
  return {
    id:'r_'+src.slice(0,60),
    src:src,
    ratio: dims ? (dims.h/dims.w) : null,
    title: d.title,
    isVideo: isVideoSrc(src),
    liked: isLiked(key),
    likeKey: key,
    onclick: "openViewerFromRemote('"+payload+"')"
  };
}
function localEntry(item){
  var key=likeKeyFor(item.src);
  return {
    id: item.id,
    src: item.src,
    ratio: item.ratio || null,
    title: item.title,
    isVideo: isVideoSrc(item.src),
    liked: isLiked(key),
    likeKey: key,
    onclick: "openViewerFromLocal('"+item.id+"')"
  };
}

function appendMasonryEntries(box, entries){

    var wrap=document.createElement('div');

    var node=wrap.firstChild;
    if(hA<=hB){ colA.appendChild(node); hA++; } else { colB.appendChild(node); hB++; }
  });

function loadMixedHomePage(){
  var box=document.getElementById('homeResults');
  var cats=Object.keys(CATEGORY_ENDPOINTS);
  var pending=cats.length, allEntries=[], anyOk=false, lastErr=null;
  cats.forEach(function(cat){

function fetchCategoryPage(category, query, page, cb){
  var apiKey=getApiKey();
  var endpoint=CATEGORY_ENDPOINTS[category] || category;
  var url='https://api.klipy.co/api/v1/'+apiKey+'/'+endpoint+'/search'
        +'?q='+encodeURIComponent(query)
        +'&page='+page
        +'&per_page=20';
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var payload=(data.data && data.data.data) || data.data || [];
    cb(true, payload, null);
  }).catch(function(err){
    cb(false, [], 'Endpoint "'+endpoint+'" falhou ('+err.message+'). Confirma o nome em CATEGORY_ENDPOINTS.');
  });
}
function attachInfiniteScrollBox(box, loadFn, hasMoreFn){
  var trigger=document.createElement('div');
  trigger.style.height='1px'; trigger.style.width='100%';
  box.appendChild(trigger);
  var obs=new IntersectionObserver(function(entries){
    if(entries[0].isIntersecting && hasMoreFn()){ trigger.remove(); obs.disconnect(); loadFn(); }
  });
  obs.observe(trigger);
}

/* ============== Push pages internas ============== */
var pageStack=[];
var swipeEdgeEl=document.getElementById('swipe-edge');
var rootEl=document.getElementById('root');
var rootDim=document.getElementById('root-dim');
function syncPageState(){
  swipeEdgeEl.classList.toggle('on', pageStack.length>0);
  rootEl.classList.toggle('pushed', pageStack.length>0);
  rootDim.style.opacity = pageStack.length ? '.22' : '0';
  pageStack.forEach(function(id,i){
    var el=document.getElementById(id), top=i===pageStack.length-1;
    el.classList.toggle('behind', !top);
    el.classList.toggle('open', top);
    el.style.zIndex = 60+i;
  });
}
function pushPage(id){
  if(pageStack.indexOf(id)>-1) return;
  var el=document.getElementById(id);
  el.classList.remove('leaving','behind','open'); el.style.transform=''; el.style.zIndex=60+pageStack.length;
  pageStack.push(id); void el.offsetWidth; requestAnimationFrame(syncPageState);
  try{ history.pushState({page:id},''); }catch(e){}
}
function popPage(opts){
  opts=opts||{}; if(!pageStack.length) return false;
  var id=pageStack.pop(), el=document.getElementById(id);
  el.classList.remove('open','behind'); el.classList.add('leaving'); el.style.transform='';
  setTimeout(function(){ el.classList.remove('leaving'); el.style.transform=''; }, 380);
  syncPageState();
  if(!opts.fromHistory) historyBackSilently();
  return true;
}
function goToPage(name){
  pushPage('page-'+name);
  if(name==='history') renderHistoryPage();
  if(name==='editprofile') openEditProfilePage();
}
document.querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click', function(){ popPage(); }); });

(function(){
  var sx=0, dx=0, drag=false, top=null, under=null, w=1;
  swipeEdgeEl.addEventListener('touchstart', function(e){
    if(!pageStack.length) return;
    sx=e.touches[0].clientX; dx=0; drag=true; w=window.innerWidth;
    top=document.getElementById(pageStack[pageStack.length-1]);
    under=pageStack.length>1?document.getElementById(pageStack[pageStack.length-2]):rootEl;
    top.classList.add('dragging'); under.classList.add('dragging');
  }, {passive:true});
  swipeEdgeEl.addEventListener('touchmove', function(e){
    if(!drag) return; dx=Math.min(w,Math.max(0,e.touches[0].clientX-sx)); var p=dx/w;
    top.style.transform='translate3d('+dx+'px,0,0)'; under.style.transform='translate3d('+(-26*(1-p))+'%,0,0)'; rootDim.style.opacity=String(.22*(1-p));
  }, {passive:true});
  function end(commit){
    if(!drag) return; drag=false;
    top.classList.remove('dragging'); under.classList.remove('dragging'); top.style.transform=''; under.style.transform='';
    if(commit && dx>w*.32) popPage(); else syncPageState();
  }
  swipeEdgeEl.addEventListener('touchend', function(){ end(true); });
  swipeEdgeEl.addEventListener('touchcancel', function(){ end(false); });
})();

/* ============== Histórico (partilhado por sheets, overlay de pesquisa e páginas) ============== */
var ignorePop=0;
function pushSheetHistory(){ try{ history.pushState({looply:1},''); }catch(e){} }
function historyBackSilently(){ ignorePop++; try{ history.back(); }catch(e){ ignorePop=Math.max(0,ignorePop-1); } setTimeout(function(){ ignorePop=Math.max(0,ignorePop-1); },700); }
window.addEventListener('popstate', function(){
  if(ignorePop>0){ ignorePop--; return; }
  handleBack();
});
function handleBack(){
  if(sheetStack.length){ closeSheet(sheetStack[sheetStack.length-1], true); return true; }
  if(searchOverlayOpen){ closeSearchOverlay(true); return true; }
  if(pageStack.length){ popPage({fromHistory:true}); return true; }
  return false;
}
window.onNativeBack = handleBack;
try{ history.replaceState({base:1},''); }catch(e){}

/* ============== Navegação para o editor externo (único arquivo separado) ============== */
function goTo(url){ location.href=url; }

/* ============== Sheets nativos (drag-to-close, mais curvos) ============== */
var sheetHost=document.getElementById('sheet-host');
var sheetStack=[];
function openSheet(html){
  dimStatusBar(true);
  var layer=document.createElement('div');
  layer.className='sheet-layer';
  layer.innerHTML='<div class="sheet-panel"><div class="sheet-handle-wrap"><div class="sheet-handle"></div></div><div class="sheet-content">'+html+'</div></div>';
  sheetHost.appendChild(layer);
  var entry={layer:layer, panel:layer.querySelector('.sheet-panel'), content:layer.querySelector('.sheet-content'), handle:layer.querySelector('.sheet-handle-wrap')};
  sheetStack.push(entry);
  layer.addEventListener('click', function(e){ if(e.target===layer) closeSheet(entry); });
  bindSheetDrag(entry);
  void layer.offsetWidth;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ layer.classList.add('open'); }); });
  pushSheetHistory();
  return entry;
}
function closeSheet(entry, fromHistory){
  entry=entry||sheetStack[sheetStack.length-1];
  if(!entry) return;
  var i=sheetStack.indexOf(entry); if(i<0) return;
  sheetStack.splice(i,1);
  entry.panel.classList.remove('dragging'); entry.panel.style.transform=''; entry.layer.style.background='';
  entry.layer.classList.remove('open'); entry.layer.classList.add('closing');
  setTimeout(function(){ entry.layer.remove(); }, 440);
  if(!sheetStack.length) dimStatusBar(false);
  if(!fromHistory) historyBackSilently();
}
function bindSheetDrag(entry){
  var panel=entry.panel, layer=entry.layer, content=entry.content, handle=entry.handle;
  var startY=0, dy=0, lastY=0, lastT=0, vel=0, dragging=false, fromContent=false;
  function begin(y, fc){ startY=lastY=y; dy=0; vel=0; lastT=performance.now(); dragging=true; fromContent=fc; }
  function move(y, ev){
    if(!dragging) return;
    var delta=y-startY;
    if(fromContent && (content.scrollTop>0 || delta<=0)){ startY=y; return; }
    if(delta<=0){ dy=0; panel.style.transform=''; return; }
    if(ev.cancelable) ev.preventDefault();
    panel.classList.add('dragging');
    var now=performance.now(); vel=(y-lastY)/Math.max(1, now-lastT); lastY=y; lastT=now;
    dy=delta; panel.style.transform='translate3d(0,'+dy+'px,0)';
    layer.style.background='rgba(0,0,0,'+(0.6*(1-Math.min(1,Math.max(0,dy/panel.offsetHeight))))+')';
  }
  function end(){
    if(!dragging) return; dragging=false; panel.classList.remove('dragging');
    if(dy>panel.offsetHeight*0.3 || vel>0.65) closeSheet(entry);
    else { panel.style.transform=''; layer.style.background=''; }
  }
  handle.addEventListener('touchstart', function(e){ begin(e.touches[0].clientY, false); }, {passive:true});
  content.addEventListener('touchstart', function(e){ begin(e.touches[0].clientY, true); }, {passive:true});
  [handle, content].forEach(function(el){
    el.addEventListener('touchmove', function(e){ move(e.touches[0].clientY, e); }, {passive:false});
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  });
}
function sheetItemHTML(action, icon, label, danger){
  return '<button class="sheet-item'+(danger?' danger':'')+'" data-act="'+action+'"><span class="ic" style="width:21px;height:21px;-webkit-mask-image:url(assets/icons/svg/'+icon+'.svg);mask-image:url(assets/icons/svg/'+icon+'.svg)"></span><span>'+label+'</span></button>';
}
function openConfirmSheet(title, msg, actionLabel, onConfirm){
  var html='<div class="sheet-title">'+escapeHtml(title)+'</div><div style="padding:0 20px 16px;font-size:13.5px;color:var(--text-dim);line-height:1.5">'+escapeHtml(msg)+'</div><div class="sheet-actions"><button class="btn-fill" id="confirmBtn">'+escapeHtml(actionLabel)+'</button></div>';

}

function openShareSheet(){
  if(!currentViewerItem) return;
  var html='<div class="sheet-title">Partilhar via</div><div class="share-apps-row">'
    + '<button class="share-app-btn" data-share="whatsapp"><span class="app-icon" style="background:#25D366"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/whatsapp.svg);mask-image:url(assets/icons/svg/whatsapp.svg)"></span></span>WhatsApp</button>'
    + '<button class="share-app-btn" data-share="telegram"><span class="app-icon" style="background:#229ED9"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/send.svg);mask-image:url(assets/icons/svg/send.svg)"></span></span>Telegram</button>'
    + '<button class="share-app-btn" data-share="instagram"><span class="app-icon" style="background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/instagram.svg);mask-image:url(assets/icons/svg/instagram.svg)"></span></span>Instagram</button>'
    + '<button class="share-app-btn" data-share="twitter"><span class="app-icon" style="background:#111"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/twitter.svg);mask-image:url(assets/icons/svg/twitter.svg)"></span></span>X</button>'
    + '<button class="share-app-btn" data-share="email"><span class="app-icon" style="background:#EA4335"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/mail.svg);mask-image:url(assets/icons/svg/mail.svg)"></span></span>Email</button>'
    + '</div><div class="sheet-sep"></div>'
    + sheetItemHTML('copy','copy','Copiar link');
  var entry=openSheet(html);
  entry.content.querySelectorAll('[data-share]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(entry); shareVia(b.dataset.share); }); });
  entry.content.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(entry); shareVia(b.dataset.act); }); });
}
async function shareVia(app){
  if(!currentViewerItem) return;
  var src=currentViewerItem.src, text=currentViewerItem.title||'Vê isto no Looply!';
  if(app!=='copy' && navigator.canShare){
    try{
      var resp=await fetch(src); var blob=await resp.blob();
      var ext=blob.type.indexOf('gif')>-1?'gif':(blob.type.indexOf('video')>-1?'mp4':'png');
      var file=new File([blob], 'looply.'+ext, {type:blob.type});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Looply', text:text}); return; }
    }catch(e){}
  }
  switch(app){
    case 'whatsapp': window.open('https://wa.me/?text='+encodeURIComponent(text+' '+src),'_blank'); break;
    case 'telegram': window.open('https://t.me/share/url?url='+encodeURIComponent(src)+'&text='+encodeURIComponent(text),'_blank'); break;
    case 'twitter': window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(src),'_blank'); break;
    case 'email': window.open('mailto:?subject=Looply&body='+encodeURIComponent(text+' '+src),'_blank'); break;
    case 'instagram': showToast('Copiámos o link — cola-o na app','copy'); copyToClipboard(src); break;
    case 'copy': copyToClipboard(src); showToast('Link copiado','check-circle'); break;
  }
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); }); }
  else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
async function downloadCurrent(){
  if(!currentViewerItem) return;
  var src=currentViewerItem.src;
  if(has('downloadFile')){ try{ Android.downloadFile(src, 'looply_'+Date.now()); showToast('A baixar...','download'); return; }catch(e){} }
  try{
    var resp=await fetch(src); var blob=await resp.blob();
    var ext=blob.type.indexOf('gif')>-1?'gif':(blob.type.indexOf('video')>-1?'mp4':'png');
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download='looply_'+Date.now()+'.'+ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    var content=getContent();
    var t=currentViewerItem.type||'gifs';
    if(!content[t]) content[t]=[];
    content[t].push({id:'dl_'+Date.now(), src:src, title:currentViewerItem.title||'Sem título', description:currentViewerItem.description||'', caption:currentViewerItem.description||'', tags:currentViewerItem.tags||[], createdAt:Date.now(), kind:'downloaded'});
    setContent(content);
    showToast('Ficheiro guardado','check-circle');
  }catch(e){ showToast('Não foi possível baixar','warning'); }
}

/* ============== Histórico completo (página) ============== */
function renderHistoryPage(){
  var h=getSearchHistory();
  var box=document.getElementById('historyPageBody');
  if(!h.length){ box.innerHTML='<div class="empty-state"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/clock.svg);mask-image:url(assets/icons/svg/clock.svg)"></span><div class="es-title">Sem pesquisas recentes</div><p>O que pesquisares vai aparecer aqui</p></div>'; return; }
  box.innerHTML=h.map(function(q){
    var safe=escapeHtml(q).replace(/'/g,"\\'");
    return '<div class="suggest-row" onclick="popPage();switchTab(\'search\');setTimeout(function(){openSearchOverlay();setTimeout(function(){document.getElementById(\'searchOverlayInput\').value=\''+safe+'\';submitOverlaySearch();},300);},260)">'
      + '<span class="ic" style="-webkit-mask-image:url(assets/icons/svg/clock.svg);mask-image:url(assets/icons/svg/clock.svg)"></span>'
      + '<span>'+escapeHtml(q)+'</span>'
      + '<button class="suggest-remove" onclick="event.stopPropagation();removeSearchHistory(\''+safe+'\');renderHistoryPage();"><span class="ic" style="-webkit-mask-image:url(assets/icons/svg/close.svg);mask-image:url(assets/icons/svg/close.svg)"></span></button>'
      + '</div>';
  }).join('');
}
