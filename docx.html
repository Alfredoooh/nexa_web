<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>ScoreZone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.1.0/css/ionicons.min.css">
<style>
  :root {
    --bg: #121212;
    --bg-elevated: #1A1A1A;
    --card: #1E1E1E;
    --accent: #1B7A3D;
    --accent-light: #25A052;
    --text: #FFFFFF;
    --text-dim: #9A9A9A;
    --border: #2A2A2A;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
  }

  body {
    margin: 0;
    padding: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header h1 ion-icon {
    color: var(--accent-light);
    font-size: 22px;
  }

  .container {
    padding: 4px 20px 32px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .field-label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .input-wrap ion-icon {
    color: var(--text-dim);
    font-size: 18px;
    flex-shrink: 0;
  }

  .input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }

  .input-wrap input::placeholder {
    color: #5A5A5A;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    padding: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .save-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }

  .save-btn:active { background: var(--accent-light); }
  .save-btn ion-icon { font-size: 17px; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }
  .status-line.ok { color: var(--accent-light); }
  .status-line.error { color: #E5484D; }
  .status-line ion-icon { font-size: 16px; }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .search-row .input-wrap { flex: 1; margin: 0; }

  .search-btn {
    width: 46px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .search-btn:active { background: var(--accent-light); }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    background: var(--bg-elevated);
    display: block;
  }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--text-dim);
  }

  .empty-state ion-icon {
    font-size: 34px;
    margin-bottom: 8px;
    display: block;
  }

  .empty-state p {
    margin: 0;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1><ion-icon name="trophy"></ion-icon> ScoreZone</h1>
</header>

<div class="container">

  <div class="card">
    <div class="field-label">
      <ion-icon name="key-outline"></ion-icon> Chave da API KLIPY
    </div>
    <div class="input-wrap">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input id="apiKeyInput" type="password" placeholder="Cole aqui a sua KLIPY API Key" autocomplete="off" spellcheck="false">
      <button class="icon-btn" onclick="toggleVisibility()">
        <ion-icon id="eyeIcon" name="eye-outline"></ion-icon>
      </button>
    </div>
    <button class="save-btn" onclick="saveKey()">
      <ion-icon name="checkmark-outline"></ion-icon> Guardar e testar
    </button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="card">
    <div class="field-label">
      <ion-icon name="search-outline"></ion-icon> Procurar GIFs e stickers
    </div>
    <div class="search-row">
      <div class="input-wrap">
        <ion-icon name="happy-outline"></ion-icon>
        <input id="searchInput" type="text" placeholder="Ex: golo, festa, futebol..." onkeydown="if(event.key==='Enter') doSearch()">
      </div>
      <button class="search-btn" onclick="doSearch()">
        <ion-icon name="arrow-forward"></ion-icon>
      </button>
    </div>
    <div id="results">
      <div class="empty-state">
        <ion-icon name="images-outline"></ion-icon>
        <p>Guarda a tua chave e faz uma pesquisa para veres os resultados aqui</p>
      </div>
    </div>
  </div>

</div>

<script>
  var API_KEY = '';

  function toggleVisibility() {
    var input = document.getElementById('apiKeyInput');
    var icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('name', 'eye-off-outline');
    } else {
      input.type = 'password';
      icon.setAttribute('name', 'eye-outline');
    }
  }

  function saveKey() {
    var input = document.getElementById('apiKeyInput');
    var status = document.getElementById('statusLine');
    var key = input.value.trim();

    if (!key) {
      status.innerHTML = '<ion-icon name="alert-circle-outline"></ion-icon> Cole uma chave antes de guardar';
      status.className = 'status-line error';
      return;
    }

    API_KEY = key;
    status.innerHTML = '<ion-icon name="checkmark-circle"></ion-icon> Chave guardada — já podes pesquisar';
    status.className = 'status-line ok';
  }

  async function doSearch() {
    var query = document.getElementById('searchInput').value.trim();
    var results = document.getElementById('results');
    var status = document.getElementById('statusLine');

    if (!API_KEY) {
      status.innerHTML = '<ion-icon name="alert-circle-outline"></ion-icon> Guarda a tua chave primeiro';
      status.className = 'status-line error';
      return;
    }

    if (!query) return;

    results.innerHTML = '<div class="empty-state"><ion-icon name="hourglass-outline"></ion-icon><p>A procurar...</p></div>';

    try {
      // Endpoint de pesquisa da KLIPY (GIF search)
      var url = 'https://api.klipy.co/api/v1/' + API_KEY + '/gifs/search?q=' + encodeURIComponent(query) + '&per_page=8';
      var response = await fetch(url);

      if (!response.ok) {
        throw new Error('Resposta ' + response.status);
      }

      var data = await response.json();
      var items = (data.data && data.data.data) || data.data || [];

      if (!items.length) {
        results.innerHTML = '<div class="empty-state"><ion-icon name="sad-outline"></ion-icon><p>Nada encontrado para "' + query + '"</p></div>';
        return;
      }

      var html = '<div class="grid">';
      items.forEach(function(item) {
        var src = item.file && item.file.sm && item.file.sm.gif && item.file.sm.gif.url;
        if (src) html += '<img src="' + src + '" loading="lazy">';
      });
      html += '</div>';
      results.innerHTML = html;

    } catch (err) {
      results.innerHTML = '<div class="empty-state"><ion-icon name="warning-outline"></ion-icon><p>Erro ao ligar à KLIPY — confirma a chave</p></div>';
      status.innerHTML = '<ion-icon name="close-circle"></ion-icon> ' + err.message;
      status.className = 'status-line error';
    }
  }
</script>

</body>
</html>
